/* ---------- Global Command Search ---------- */
function searchItems(q) {
  q = (q || "").trim().toLowerCase();
  if (!q) return [];
  const out = [];
  const has = (...a) => a.join(" ").toLowerCase().includes(q);
  const adm = me && me.role === "admin";
  const own = x => adm || x.Unit_ID === me.Unit_ID;

  if (NAV[me.role]) {
    NAV[me.role].forEach(g => g.items.forEach(it => {
      if (has(it[0], it[1], g.g)) {
        out.push({ icon: ITEM_ICON[it[0]] || "dash", t: it[1], sub: T("เมนูหลัก") + " " + it[0], go: it[0] });
      }
    }));
  }
  if (adm) {
    residents().forEach(u => {
      if (has(u.User_ID, u.fname, u.lname, u.Unit_ID, u.phone)) {
        out.push({ icon: "users", t: fullName(u), sub: u.User_ID + " · " + T("ห้อง") + " " + (u.Unit_ID || "-"), go: "3.1", hl: u.User_ID });
      }
    });
    db.units.forEach(u => {
      if (has(u.Unit_ID)) {
        out.push({ icon: "building", t: T("ห้อง") + " " + u.Unit_ID, sub: u.status + " · " + u.size + " " + T("ตร.ม."), go: "4.1", hl: u.Unit_ID });
      }
    });
  }
  db.invoices.forEach(i => {
    if (own(i) && has(i.Invoice_ID)) {
      out.push({ icon: "receipt", t: i.Invoice_ID, sub: T("ห้อง") + " " + i.Unit_ID + " · " + money(i.total) + " " + T("บาท") + " · " + i.status, go: adm ? "1.1" : "u1.1", hl: i.Invoice_ID });
    }
  });
  db.parcels.forEach(p => {
    if (own(p) && has(p.Parcel_ID, p.tracking)) {
      out.push({ icon: "box", t: T("พัสดุ") + " " + p.Parcel_ID, sub: p.carrier + " · " + T("ห้อง") + " " + p.Unit_ID, go: adm ? "6.1" : "6.3", hl: p.Parcel_ID });
    }
  });
  db.tickets.forEach(t => {
    if ((adm || t.User_ID === me.User_ID) && has(t.Ticket_ID, t.category, t.place)) {
      out.push({ icon: "wrench", t: T("งานซ่อม") + " " + t.Ticket_ID, sub: t.category + " · " + t.status, go: adm ? "9.4" : "9.1", hl: t.Ticket_ID });
    }
  });
  return out.slice(0, 8);
}

let sRes = [], sIdx = 0;
function drawSearch() {
  const box = $("#nsearch");
  if (!box) return;
  let r = box.querySelector(".sresults");
  const q = ($("#q-search") || {}).value || "";
  sRes = searchItems(q);
  if (!q.trim()) {
    if (r) r.remove();
    return;
  }
  if (!r) {
    r = document.createElement("div");
    r.className = "sresults";
    r.setAttribute("role", "listbox");
    box.appendChild(r);
  }
  r.innerHTML = sRes.length ? sRes.map((x, i) =>
    '<button role="option" data-sr="' + i + '" class="' + (i === sIdx ? "on" : "") + '">' +
      '<span class="ti">' + ico(x.icon) + '</span>' +
      '<span>' + esc(x.t) + '<br><small>' + esc(x.sub) + '</small></span>' +
      ico("arrow") +
    '</button>'
  ).join("") : '<div class="empty" style="padding:16px">' + ico("search") + '<span>' + T("ไม่พบ") + ' “' + esc(q) + '”</span></div>';
}

function pickSearch(i) {
  const x = sRes[i];
  if (!x) return;
  const inp2 = $("#q-search");
  if (inp2) { inp2.value = ""; inp2.blur(); }
  drawSearch();
  if (x.go === "3.1") sel.q = "";
  closeModal(true);
  if (x.hl) sel.hl = x.hl;
  go(x.go);
}

/* ---------- Shell Layout ---------- */
function foldPanels(m) {
  const f = uiPref().fold || [];
  m.querySelectorAll(".panel > .card-h").forEach(h => {
    const p = h.parentElement;
    const key = (h.querySelector("h2") || h).textContent.trim().slice(0, 40);
    p.dataset.fold = key;
    if (!h.querySelector(".fold-btn")) {
      const b = document.createElement("button");
      b.className = "fold-btn";
      b.setAttribute("data-act", "fold");
      b.setAttribute("data-id", key);
      b.setAttribute("aria-label", T("พับ/ขยาย"));
      b.title = T("พับ/ขยาย");
      b.innerHTML = ico("chev");
      h.appendChild(b);
    }
    const shut = f.includes(key);
    p.classList.toggle("folded", shut);
    const fb = h.querySelector(".fold-btn");
    if (fb) fb.setAttribute("aria-expanded", String(!shut));
  });
}

function viewIcon(k) {
  if (ITEM_ICON[k]) return ITEM_ICON[k];
  const nav = NAV[me.role];
  for (const g of nav) {
    if (g.items.some(i => i[0] === k)) return groupIcon(g.g);
  }
  return "home";
}

function setSideW(w) {
  if (typeof document !== "undefined" && document.documentElement && document.documentElement.style && document.documentElement.style.setProperty) {
    document.documentElement.style.setProperty("--side-w", w + "px");
  }
}

function initSidebarResizer() {
  const pref = uiPref();
  const savedW = pref.sideW;
  if (savedW && !pref.mini) {
    setSideW(savedW);
  } else if (!pref.mini) {
    setSideW(290);
  }

  const resizer = $("#side-resizer");
  if (!resizer) return;

  let startX = 0;
  let startW = 0;
  let isDragging = false;

  const onPointerDown = e => {
    if (e.button !== undefined && e.button !== 0) return;
    const side = document.querySelector(".side");
    if (!side) return;

    isDragging = true;
    startX = e.clientX;
    startW = side.getBoundingClientRect().width;
    document.body.classList.add("is-resizing");

    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
    e.preventDefault();
  };

  const onPointerMove = e => {
    if (!isDragging) return;
    const delta = e.clientX - startX;
    let newW = Math.round(startW + delta);
    const maxW = Math.min(650, Math.round(window.innerWidth * 0.45));
    newW = Math.max(200, Math.min(maxW, newW));
    setSideW(newW);
    setPref("sideW", newW);
  };

  const onPointerUp = () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.classList.remove("is-resizing");
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerUp);
  };

  resizer.addEventListener("dblclick", () => {
    setSideW(290);
    setPref("sideW", 290);
    toast(T("รีเซ็ตขนาดแถบเมนูแล้ว"), "info");
  });

  resizer.addEventListener("keydown", e => {
    const side = document.querySelector(".side");
    if (!side) return;
    const curW = side.getBoundingClientRect().width;
    let newW = curW;
    if (e.key === "ArrowLeft") newW = Math.max(200, curW - 20);
    else if (e.key === "ArrowRight") newW = Math.min(600, curW + 20);
    else if (e.key === "Home") newW = 290;
    else if (e.key === "End") newW = 480;
    else return;

    e.preventDefault();
    setSideW(newW);
    setPref("sideW", newW);
  });

  resizer.addEventListener("pointerdown", onPointerDown);
}

      '<div class="brand" data-go="' + (me.role === "admin" ? "8.1" : "home") + '"><span class="logo">' + ico("building") + '</span><span class="brand-t"><b>Condo UTS</b><span>' + T("ระบบบริหารจัดการห้องชุดและผู้เช่า") + '</span></span></div>' +
      '<div class="nav-search" id="nsearch">' + ico("search") + '<input id="q-search" type="search" placeholder="' + T("ค้นหาเมนู ห้อง ผู้อยู่อาศัย เลขใบแจ้งหนี้…") + '" autocomplete="off" aria-label="' + T("ค้นหา") + '"><kbd>/</kbd></div>' +
      '<div class="who">' +
        '<button class="lang-btn" data-act="lang" aria-label="' + T("เปลี่ยนภาษา") + '" title="' + T("เปลี่ยนภาษา") + '" translate="no">' + ico("lang") + '<span>' + (LANG === "en" ? "EN" : "TH") + '</span></button>' +
        '<button class="icon-btn" data-act="theme" aria-label="' + T("สลับธีมสว่าง/มืด") + '">' + ico(adminLight() ? "moon" : "sun") + '</button>' +
        '<button class="icon-btn" data-act="fullscreen" aria-label="' + (isFs ? T("ออกจากโหมดเต็มจอ") : T("เต็มจอ")) + '" title="' + (isFs ? T("ออกจากโหมดเต็มจอ (Esc)") : T("เต็มจอ")) + '">' + ico(isFs ? "minimize" : "maximize") + '</button>' +
        '<button class="icon-btn" id="bell" data-act="bell" aria-label="' + T("การแจ้งเตือน") + '">' + ico("bell") + '<span id="badge"></span></button>' +
        '<button class="av-btn" id="avbtn" data-act="avatar" aria-haspopup="menu" aria-expanded="false" aria-label="' + T("เมนูบัญชีผู้ใช้") + '">' +
          '<span class="avatar">' + esc(me.fname.slice(0, 1)) + '</span>' +
          '<span class="who-t"><span>' + esc(fullName(me)) + '</span><small>' + esc(roleTxt) + '</small></span>' +
          ico("chev", "gc") +
        '</button>' +
      '</div>' +
    '</div></header>' +
    '<div class="scrim" data-act="navClose"></div>' +
    '<div class="shell">' +
      '<aside class="side" aria-label="' + T("เมนูหลัก") + '">' +
        nav.map(g => {
          const isShut = shut.includes(g.g);
          return '<div class="grp' + (isShut ? " shut" : "") + '" data-grp="' + esc(g.g) + '">' +
            '<button class="grp-h" data-act="grpToggle" data-id="' + esc(g.g) + '" aria-expanded="' + (!isShut) + '">' +
              ico(groupIcon(g.g)) + '<span class="gt">' + esc(g.g) + '</span>' + ico("chev", "gc") +
            '</button>' +
            '<div class="grp-b"><div>' +
              g.items.map(it => {
                const badgeCount = getBadgeCount(it[0]);
                return '<button class="nav-btn" data-go="' + it[0] + '" title="' + esc(it[1]) + '"' + (it[0] === view ? ' aria-current="page"' : "") + '>' +
                  '<span class="ni">' + ico(ITEM_ICON[it[0]] || groupIcon(g.g)) + '</span>' +
                  '<span class="mono">' + esc(codeOf(it[0])) + '</span>' +
                  '<span class="nl">' + esc(it[1]) + '</span>' +
                  (badgeCount > 0 ? '<span class="nav-pill">' + badgeCount + '</span>' : '') +
                '</button>';
              }).join("") +
            '</div></div></div>';
        }).join("") +
      '</aside>' +
      '<div class="side-resizer" id="side-resizer" role="separator" aria-orientation="vertical" tabindex="0" title="' + T("ลากเพื่อปรับขนาดแถบเมนู (ดับเบิลคลิกเพื่อรีเซ็ต)") + '" aria-label="' + T("ปรับขนาดแถบเมนู") + '"></div>' +
      '<main id="main"></main>' +
    '</div>';
  initSidebarResizer();
  renderMain(true);
}

function renderMain(enter) {
  const v = V[view];
  const m = $("#main");
  if (!m || !v) return;
  const code = codeOf(view);
  m.innerHTML = (v.noHead ? "" : '<div class="head"><span class="head-ic">' + ico(viewIcon(view)) + '</span><div class="head-t">' + (code ? '<span class="code">PROCESS ' + esc(code) + '</span>' : "") + '<h1>' + esc(navTitle(view)) + '</h1>' + (v.io ? '<div class="flow">' + v.io + '</div>' : "") + '</div></div>') +
    (flashMsg ? '<div class="flash ' + flashMsg.kind + '" role="status">' + ico(flashMsg.kind === "bad" ? "alert" : "check") + '<span>' + esc(flashMsg.msg) + '</span></div>' : '') +
    v.render();

  if (sel.hl) {
    const r = m.querySelector('[data-row="' + CSS.escape(sel.hl) + '"]');
    if (r) {
      r.classList.add("is-new");
      setTimeout(() => r.scrollIntoView({ block: "center", behavior: "smooth" }), 100);
    }
    sel.hl = null;
  }
  document.querySelectorAll(".nav-btn").forEach(b => {
    if (b.dataset.go === view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  foldPanels(m);
  updateBell();
}

function adminLight() {
  try { return localStorage.getItem(KEY + "-adm-theme") === "light"; } catch (e) { return false; }
}

function render() {
  const isLight = adminLight();
  document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
  document.body.classList.toggle("admin-light", isLight);
  document.documentElement.lang = LANG;
  if (!me) return renderLogin();
  shell();
}

function go(k) {
  view = k;
  flashMsg = null;
  closeNotif(true);
  closeDD(true);
  document.body.classList.remove("nav-open");
  try { sessionStorage.setItem(KEY + "-view", k); } catch (e) {}
  renderMain(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Global Event Listeners ---------- */
document.addEventListener("click", e => {
  if (notifEl && !e.target.closest(".notif") && !e.target.closest("#bell")) closeNotif();
  if (ddEl && !e.target.closest(".dd") && !e.target.closest("#avbtn")) closeDD();

  const g = e.target.closest("[data-go]");
  if (g) {
    e.preventDefault();
    closeModal();
    go(g.dataset.go);
    return;
  }

  const b = e.target.closest("[data-act]");
  if (!b) return;
  e.preventDefault();
  const act = b.dataset.act, id = b.dataset.id;
  if (!A[act]) return;

  if (b.dataset.confirm) {
    const c = (CONFIRM[act] || (() => [T("ยืนยันการทำรายการ"), "", b.textContent.trim()]))(id);
    confirmModal(c[0], c[1], c[2], () => {
      flashMsg = null;
      const row = REMOVES[act] && document.querySelector('#main [data-row="' + CSS.escape(id) + '"]');
      if (row) {
        row.style.transition = "all 0.25s ease";
        row.style.opacity = "0";
        row.style.transform = "translateX(20px)";
        setTimeout(() => runAct(act, id, b), 250);
      } else {
        runAct(act, id, b);
      }
    });
    return;
  }

  if (!["bell", "avatar", "theme", "fullscreen", "sideMini", "grpToggle", "fold", "lang", "navToggle", "navClose", "readAll", "openNotif", "fill", "slip", "contractImg", "ticketImg", "setUnitView"].includes(act)) {
    flashMsg = null;
  }
  runAct(act, id, b);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeDD();
    if (modalEl) closeModal();
    else if (notifEl) closeNotif();
    document.body.classList.remove("nav-open");
    return;
  }
  if (e.target.id === "q-search") {
    if (e.key === "ArrowDown") {
      sIdx = Math.min(sIdx + 1, sRes.length - 1);
      drawSearch();
      e.preventDefault();
    } else if (e.key === "ArrowUp") {
      sIdx = Math.max(sIdx - 1, 0);
      drawSearch();
      e.preventDefault();
    } else if (e.key === "Enter") {
      pickSearch(sIdx);
      e.preventDefault();
    } else if (e.key === "Escape") {
      e.target.value = "";
      drawSearch();
      e.target.blur();
    }
    return;
  }
  if (e.key === "/" && !modalEl && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || "") && $("#q-search")) {
    e.preventDefault();
    $("#q-search").focus();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "q-search") {
    sIdx = 0;
    drawSearch();
  }
});

document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const h = H[form.dataset.form];
  if (!h) return;
  flashMsg = null;
  const fe = form.querySelector(".form-err");
  if (fe) fe.innerHTML = "";

  const inModal = !!form.closest(".overlay");
  const before = view;
  const r = h(new FormData(form), form, false);
  if (form.dataset.form === "login") return;
  if (r === false) return;
  if (inModal) closeModal();
  save();
  const moved = view !== before;
  if (moved) {
    try { sessionStorage.setItem(KEY + "-view", view); } catch (err) {}
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  renderMain(moved);
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset && el.dataset.img) {
    const form = el.closest("form");
    const file = el.files[0];
    if (!file) return;
    try {
      const url = await resizeImage(file);
      form.dataset[el.dataset.img] = url;
      let p = el.parentNode.querySelector("img.preview-img");
      if (p) p.remove();
      p = document.createElement("img");
      p.className = "preview-img";
      p.alt = T("ตัวอย่างรูปที่แนบ");
      p.src = url;
      el.parentNode.appendChild(p);
      const s = el.parentNode.querySelector("[data-prev]");
      if (s) s.remove();
      const fe = form.querySelector(".form-err");
      if (fe) fe.innerHTML = "";
    } catch (err) {
      toast(T("อ่านไฟล์รูปไม่ได้ ลองไฟล์อื่น"), "bad");
    }
    return;
  }
  if (el.dataset && el.dataset.doc) {
    const form = el.closest("form");
    const file = el.files[0];
    if (!file) return;
    form.dataset.fileName = file.name;
    if (file.size < 400000) {
      const r = new FileReader();
      r.onload = () => { form.dataset.file = r.result; };
      r.readAsDataURL(file);
    } else {
      form.dataset.file = "";
    }
    return;
  }

  const form = el.closest && el.closest("form[data-live]");
  if (!form) return;
  const h = H[form.dataset.form];
  if (!h) return;
  const keep = form.dataset.slip;
  h(new FormData(form), form, true);
  renderMain(false);
  if (keep && form.dataset.form === "1.2") {
    const f = document.querySelector('form[data-form="1.2"]');
    if (f) {
      f.dataset.slip = keep;
      const i = f.querySelector('[data-img="slip"]');
      if (i && !f.querySelector("img.preview-img")) {
        const p = document.createElement("img");
        p.className = "preview-img";
        p.alt = T("ตัวอย่างรูปที่แนบ");
        p.src = keep;
        i.parentNode.appendChild(p);
      }
    }
  }
});

function updateFullscreenBtn() {
  const isFs = typeof document !== "undefined" && !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.querySelectorAll('[data-act="fullscreen"]').forEach(btn => {
    btn.setAttribute("aria-label", isFs ? T("ออกจากโหมดเต็มจอ") : T("เต็มจอ"));
    btn.setAttribute("title", isFs ? T("ออกจากโหมดเต็มจอ (Esc)") : T("เต็มจอ"));
    btn.innerHTML = ico(isFs ? "minimize" : "maximize");
  });
}
if (typeof document !== "undefined") {
  document.addEventListener("fullscreenchange", updateFullscreenBtn);
  document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);
}

/* ---------- Application Bootstrap ---------- */
load();
try {
  const id = sessionStorage.getItem(KEY + "-me");
  if (id) {
    me = userById(id) || null;
    const v = sessionStorage.getItem(KEY + "-view");
    view = me && v && V[v] && NAV[me.role].some(g => g.items.some(i => i[0] === v)) ? v : (me ? (me.role === "admin" ? "8.1" : "home") : null);
  }
} catch (e) {}
render();
if (typeof window !== "undefined") {
  window._app = { get db() { return db; }, set db(v) { db = v; }, get me() { return me; }, set me(v) { me = v; }, get view() { return view; }, set view(v) { view = v; }, H, V, NAV, A, sel, seed, render, go, toast, load, save, get flashMsg() { return flashMsg; }, get fails() { return fails; }, set fails(v) { fails = v; } };
}


})();
