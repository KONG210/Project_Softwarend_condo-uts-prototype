<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Condo Unit &amp; Tenant System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: lobby directory — frosted top bar, process index rail on the left (drawer on phones), work surface of soft cards on the right */
:root{
  --bg:#F3F1EC; --bg-2:#ECE8E0; --surface:#FFFFFF; --surface-2:#F8F6F1; --sunk:#EFEBE3; --ink:#1F1D19; --muted:#6B655A; --line:#DDD6C9; --line-2:#EAE5DB;
  --accent:#8F6B28; --accent-2:#6E4F1A; --accent-ink:#FFFFFF; --accent-soft:#F1E7D2; --brass:#4A4740; --brass-soft:#E9E6DF;
  --gold-a:#B38A3E; --gold-b:#6E4F1A; --hero-ink:#FFFDF7;
  --ok:#2F7A4E; --ok-soft:#E1F0E5; --warn:#9A6210; --warn-soft:#F8EBD2; --bad:#B2382F; --bad-soft:#F9E0DD; --info:#3A5F8F; --info-soft:#E2E9F3;
  --shadow-1:0 1px 2px rgba(40,30,10,.06),0 1px 1px rgba(40,30,10,.04);
  --shadow-2:0 8px 24px -8px rgba(40,30,10,.18),0 2px 6px rgba(40,30,10,.06);
  --shadow-3:0 24px 60px -18px rgba(30,22,8,.38),0 6px 18px rgba(30,22,8,.10);
  --scrim:rgba(20,16,10,.42); --glass:rgba(255,253,248,.8);
  --f-display:"Plus Jakarta Sans","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.26,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11100E; --bg-2:#161512; --surface:#1A1916; --surface-2:#1F1E1A; --sunk:#25231F; --ink:#ECE7DC; --muted:#A39C8E; --line:#34312B; --line-2:#2A2824;
  --accent:#D2B06A; --accent-2:#E3C68A; --accent-ink:#1A1408; --accent-soft:#3A3020; --brass:#C9C3B6; --brass-soft:#2C2A26;
  --gold-a:#A9843C; --gold-b:#4F3912; --hero-ink:#FFF8E8;
  --ok:#6CCB97; --ok-soft:#183427; --warn:#E5B465; --warn-soft:#3A2D15; --bad:#EE8A82; --bad-soft:#3D1F1C; --info:#93B5E0; --info-soft:#1D2838;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 10px 28px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); --shadow-3:0 28px 70px -20px rgba(0,0,0,.75),0 6px 18px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6); --glass:rgba(26,25,22,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11100E; --bg-2:#161512; --surface:#1A1916; --surface-2:#1F1E1A; --sunk:#25231F; --ink:#ECE7DC; --muted:#A39C8E; --line:#34312B; --line-2:#2A2824;
  --accent:#D2B06A; --accent-2:#E3C68A; --accent-ink:#1A1408; --accent-soft:#3A3020; --brass:#C9C3B6; --brass-soft:#2C2A26;
  --gold-a:#A9843C; --gold-b:#4F3912; --hero-ink:#FFF8E8;
  --ok:#6CCB97; --ok-soft:#183427; --warn:#E5B465; --warn-soft:#3A2D15; --bad:#EE8A82; --bad-soft:#3D1F1C; --info:#93B5E0; --info-soft:#1D2838;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 10px 28px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); --shadow-3:0 28px 70px -20px rgba(0,0,0,.75),0 6px 18px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6); --glass:rgba(26,25,22,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 85% -10%,var(--accent-soft),transparent 60%),radial-gradient(900px 400px at -10% 110%,var(--brass-soft),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.84em;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-2)}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--gold-a),var(--gold-b));display:grid;place-items:center;color:var(--hero-ink);box-shadow:var(--shadow-1);flex:none}
.logo svg.i{width:19px;height:19px}
.brand-t{display:grid;line-height:1.2;min-width:0}
.brand-t b{font-family:var(--f-display);font-size:1.02rem}
.brand-t span{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-family:var(--f-display)}
.who-t{display:grid;line-height:1.15;font-size:.88rem}
.who-t small{color:var(--muted);font-size:.74rem}
.icon-btn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);animation:pop .45s var(--spring)}
.menu-btn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;max-width:1320px;margin:0 auto;padding-block:22px 64px}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px;box-shadow:var(--shadow-1);scrollbar-width:thin}
.grp{padding:4px 0 8px}
.grp+.grp{border-top:1px dashed var(--line-2);padding-top:10px}
.grp h4{display:flex;align-items:center;gap:8px;margin:0 6px 4px;font-family:var(--f-display);font-size:.78rem;font-weight:600;color:var(--muted)}
.grp h4 svg.i{width:16px;height:16px;color:var(--accent)}
.nav-btn{position:relative;display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:.9rem}
.nav-btn .mono{color:var(--muted);min-width:2.5em;font-size:.76rem}
.nav-btn:hover{background:var(--sunk)}
.nav-btn[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent)}
.nav-btn[aria-current="page"] .mono{color:var(--accent-ink);opacity:.75}
.side-foot{border-top:1px solid var(--line-2);padding-top:10px;margin-top:4px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}

main{min-width:0;display:grid;gap:18px;align-content:start}
.head{display:flex;gap:14px;align-items:flex-start}
.head-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.head-ic svg.i{width:23px;height:23px}
.head-t{display:grid;gap:4px;min-width:0}
.code{font-family:var(--f-mono);font-size:.74rem;color:var(--accent);letter-spacing:.08em}
.head h1{font-size:1.6rem}
.flow{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.flow span{background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:1px 10px}
.flow b{color:var(--ink);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow-1)}
.panel h2{font-size:1.04rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}

/* ---------- motion ---------- */
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(10px);opacity:.01}to{transform:none;opacity:1}}
@keyframes modalIn{from{transform:translateY(14px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes modalOut{to{transform:translateY(8px) scale(.96);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes toastIn{from{transform:translateX(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(30px) scale(.94);opacity:0}}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes flashRow{0%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
main.enter>*{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.tiles>.tile{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
tr.is-new td{animation:flashRow 1.8s ease-out}
.item.is-new{animation:pop .5s var(--spring)}
.leaving{transition:opacity .22s ease,transform .22s ease;opacity:0;transform:translateX(18px)}
.track i{transform-origin:left;animation:grow .7s var(--ease) both}
.bell-ring svg.i{animation:ring .8s ease}

/* ---------- forms ---------- */
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px 16px}
.fld{display:grid;gap:5px;min-width:0;align-content:start}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.8rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:8px;background:var(--surface);border-style:dashed;cursor:pointer}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;box-shadow:var(--shadow-1);transition:transform .18s var(--spring),filter .15s,background .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.08);box-shadow:var(--shadow-2)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.sm{padding:5px 12px;font-size:.84rem}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg.i{width:16px;height:16px}
.row-acts{display:flex;gap:4px;justify-content:flex-end}
.ibtn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:transform .18s var(--spring),background .15s,color .15s}
.ibtn svg.i{width:17px;height:17px}
.ibtn:hover{background:var(--accent-soft);color:var(--accent);transform:scale(1.08)}
.ibtn.del:hover{background:var(--bad-soft);color:var(--bad)}
.ibtn:active{transform:scale(.9)}
.preview-img{max-width:200px;max-height:150px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:6px;animation:pop .4s var(--spring)}
.form-err{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--bad);background:var(--bad-soft);border-radius:var(--r-sm);padding:9px 12px;font-weight:500;animation:shake .45s ease}
.form-err:empty{display:none}
.err{color:var(--bad)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-1)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:240px}
th{font-weight:600;font-size:.75rem;color:var(--muted);letter-spacing:.04em;background:var(--surface-2);position:sticky;top:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:34px 20px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty svg.i{width:30px;height:30px;color:var(--line)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:16px 18px;display:grid;gap:2px;box-shadow:var(--shadow-1);text-align:left;color:inherit;overflow:hidden;transition:transform .25s var(--spring),box-shadow .2s}
button.tile{cursor:pointer;font:inherit}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.tile .ti{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ti.b{background:var(--brass-soft);color:var(--brass)}
.tile .ti.r{background:var(--bad-soft);color:var(--bad)}
.tile .k{font-size:.8rem;color:var(--muted);padding-right:40px}
.tile .v{font-family:var(--f-display);font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .s{font-size:.78rem;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 2.5em;gap:10px;align-items:center;font-size:.88rem}
.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-a),var(--accent));border-radius:99px}

/* ---------- hero (resident) ---------- */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--r) + 4px);padding:24px 26px;background:linear-gradient(135deg,var(--gold-a) 0%,var(--gold-b) 100%);color:var(--hero-ink);box-shadow:var(--shadow-2)}
.hero h2{font-size:1.45rem}
.hero p{margin:.2em 0 0;opacity:.85}
.hero svg.sky{position:absolute;right:-6px;bottom:-4px;width:min(46%,320px);height:auto;opacity:.22;stroke:none;fill:currentColor}

/* ---------- lists / cards ---------- */
.flash{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);font-weight:500;background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,currentColor 30%,transparent);animation:pop .5s var(--spring)}
.flash.bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:.84rem;color:var(--muted)}
.list{display:grid;gap:12px}
.item{border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;box-shadow:var(--shadow-1);transition:transform .25s var(--spring),box-shadow .2s}
.item:hover{box-shadow:var(--shadow-2)}
.item .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.item h3{font-size:1.02rem}
.prio-ด่วน{border-left:4px solid var(--bad)}
.prio-สำคัญ{border-left:4px solid var(--warn)}
.qr{width:160px;height:160px;image-rendering:pixelated;border:10px solid #fff;background:#fff;border-radius:12px;box-shadow:var(--shadow-2)}

/* ---------- overlays ---------- */
#toasts{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);align-content:end;right:max(16px,env(safe-area-inset-right,0px));z-index:60;display:grid;gap:10px;width:min(360px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);padding:12px 12px 14px 14px;border-radius:var(--r);box-shadow:var(--shadow-3);animation:toastIn .45s var(--spring);font-size:.9rem}
.toast.out{animation:toastOut .25s ease forwards}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.toast.bad .ti{background:var(--bad-soft);color:var(--bad)}
.toast.info .ti{background:var(--info-soft);color:var(--info)}
.toast .ti svg.i{width:16px;height:16px}
.toast b{display:block;font-family:var(--f-display);font-size:.92rem}
.toast .tx{padding-top:3px}
.toast .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:6px}
.toast .x:hover{background:var(--sunk)}
.toast .tb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--ok);transform-origin:left;animation:bar 3.6s linear forwards}
.toast.bad .tb{background:var(--bad)}.toast.info .tb{background:var(--info)}

.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadeIn .2s ease}
.overlay.out{animation:fadeOut .22s ease forwards}
.overlay.out .modal{animation:modalOut .22s ease forwards}
.modal{width:min(640px,100%);max-height:min(88vh,860px);overflow:auto;background:var(--surface);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow-3);animation:modalIn .42s var(--spring);border:1px solid var(--line-2)}
.modal.sm{width:min(420px,100%)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.modal-h h2{font-size:1.15rem;margin-right:auto}
.modal-b{padding:16px 20px 20px}
.modal-b form.f,.modal-b .panel{border:0;box-shadow:none;padding:0;background:none}
.danger-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);animation:pop .5s var(--spring)}
.danger-ic svg.i{width:22px;height:22px}
.modal-acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.modal img.full{display:block;max-width:100%;border-radius:10px;background:#fff}

/* notification panel */
.notif{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:max(16px,env(safe-area-inset-right,0px));z-index:45;width:min(380px,calc(100% - 32px));max-height:min(70vh,560px);display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow-3);transform-origin:top right;animation:modalIn .38s var(--spring);overflow:hidden}
.notif.out{animation:modalOut .18s ease forwards}
.notif-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.notif-h h3{font-size:1rem}
.notif-l{overflow:auto}
.nitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:12px 16px;cursor:pointer;color:var(--ink);animation:rise .35s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.nitem:hover{background:var(--surface-2)}
.nitem .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.nitem.bad .ti{background:var(--bad-soft);color:var(--bad)}
.nitem.warn .ti{background:var(--warn-soft);color:var(--warn)}
.nitem small{display:block;color:var(--muted);font-size:.76rem}
.nitem .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.nitem.read{opacity:.62}
.nitem.read .dot{visibility:hidden}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0}
.login-art{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--gold-a) 0%,var(--gold-b) 100%);color:var(--hero-ink);padding:48px clamp(24px,5vw,64px);display:grid;align-content:space-between;gap:24px}
.login-art h1{font-size:clamp(1.7rem,3vw,2.4rem);max-width:16ch}
.login-art p{opacity:.85;max-width:44ch;margin:.6em 0 0}
.login-art .feat{display:flex;flex-wrap:wrap;gap:8px}
.login-art .feat span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:4px 12px;border-radius:99px;font-size:.82rem}
.login-art svg.sky{width:100%;max-width:520px;height:auto;fill:currentColor;opacity:.2}
.login-side{display:grid;place-items:center;padding-block:40px}
.login-card{width:min(100%,420px);display:grid;gap:16px;animation:modalIn .55s var(--spring)}
.login-card .panel{display:grid;gap:14px;box-shadow:var(--shadow-2)}
.login-card h2{font-size:1.35rem}
.demo{display:grid;gap:6px}
.demo button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.demo .mono{color:var(--muted)}


/* ---------- polish ---------- */
svg.i{stroke-width:1.9}
.btn,.nav-btn,.ibtn,button.tile,.nitem,.icon-btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .65s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.spark{position:fixed;z-index:70;width:7px;height:7px;border-radius:50%;margin:-3.5px 0 0 -3.5px;pointer-events:none;animation:spark .75s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.side{position:sticky}
.nav-ind{position:absolute;top:0;left:12px;z-index:0;border-radius:10px;background:linear-gradient(135deg,var(--gold-a),var(--accent));box-shadow:0 8px 18px -8px var(--accent);transition:transform .45s var(--spring),height .3s var(--ease),width .3s var(--ease),opacity .2s;opacity:0;pointer-events:none}
.nav-btn{z-index:1;transition:color .2s,background .15s}
.nav-btn[aria-current="page"]{background:transparent!important;box-shadow:none!important;color:var(--hero-ink)}
.nav-btn[aria-current="page"] .mono{color:var(--hero-ink)}
.nav-btn .ni{display:grid;place-items:center;width:20px;transition:transform .35s var(--spring)}
.nav-btn .ni svg.i{width:17px;height:17px}
.nav-btn:hover .ni{transform:scale(1.18) rotate(-6deg)}
.nav-btn[aria-current="page"] .ni{animation:pop .5s var(--spring)}
.nav-btn .mono{min-width:2.3em;font-size:.72rem}
.nav-btn{gap:8px;font-size:.87rem;line-height:1.35}
main.enter .head-ic{animation:pop .6s var(--spring) both}
.head-ic{background:linear-gradient(145deg,var(--accent-soft),var(--surface));border:1px solid var(--line-2);box-shadow:var(--shadow-1)}
.tile .ti{transition:transform .4s var(--spring);background:linear-gradient(145deg,var(--accent-soft),var(--surface));border:1px solid var(--line-2)}
.tile .ti.b{background:linear-gradient(145deg,var(--brass-soft),var(--surface))}
.tile .ti.r{background:linear-gradient(145deg,var(--bad-soft),var(--surface))}
.tile:hover .ti{transform:scale(1.15) rotate(-8deg)}
.tile::after{content:"";position:absolute;inset:auto -20% -60% auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);opacity:.0;transition:opacity .3s}
.tile:hover::after{opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-100%);animation:shine 1.6s .3s var(--ease) forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
.hero h2{animation:rise .5s var(--ease) both .1s}
.sky .blk rect{fill:currentColor}
.sky .win{fill:currentColor;opacity:.25;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
.login-art svg.sky{opacity:.32}
.hero svg.sky{opacity:.3}
.badge::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--bad);animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.empty svg.i{width:38px;height:38px;color:var(--accent);opacity:.55;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.item{transition:transform .3s var(--spring),box-shadow .2s}
.item:hover{transform:translateY(-2px)}
tr.is-new .pill{animation:pop .55s var(--spring)}
.toast .ti{animation:pop .55s var(--spring) .08s both}
.modal-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent-soft),var(--surface));color:var(--accent);border:1px solid var(--line-2);animation:pop .55s var(--spring)}
.modal-ic svg.i{width:22px;height:22px}
.btn svg.i{transition:transform .3s var(--spring)}
.btn:hover svg.i{transform:scale(1.15) rotate(-6deg)}
.btn:not(.ghost):not(.danger-t){background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0))}
.icon-btn:hover svg.i{animation:ring .7s ease}
.logo{transition:transform .4s var(--spring)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
.pill{transition:transform .2s var(--spring)}
tbody tr:hover .pill{transform:scale(1.05)}
.flash svg.i{animation:pop .55s var(--spring) .1s both}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:16px}
  .menu-btn{display:grid}
  .side{position:fixed;z-index:30;top:0;left:0;bottom:0;width:min(300px,86vw);max-height:none;border-radius:0 var(--r) var(--r) 0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(12px,env(safe-area-inset-left,0px));transform:translateX(-104%);transition:transform .38s var(--ease);box-shadow:var(--shadow-3)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .head h1{font-size:1.3rem}
  .who-t{display:none}
  .lo-t{display:none}
  .brand-t span{display:none}
  .login{grid-template-columns:1fr}
  .login-art{padding-block:32px 24px}
  .login-art svg.sky{display:none}
}

/* ================= ADMIN THEME (DevMerge-style, dark-first) ================= */
body.admin-theme{
  --bg:#0b0f17; --bg-2:#0f172a; --surface:#111827; --surface-2:#0f172a; --sunk:#1a2232; --ink:#ffffff; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.08);
  --accent:#3b82f6; --accent-2:#60a5fa; --accent-ink:#ffffff; --accent-soft:rgba(59,130,246,.16); --brass:#94a3b8; --brass-soft:rgba(148,163,184,.12);
  --gold-a:#3b82f6; --gold-b:#1d4ed8; --hero-ink:#ffffff;
  --ok:#22c55e; --ok-soft:rgba(34,197,94,.14); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14); --bad:#ef4444; --bad-soft:rgba(239,68,68,.14); --info:#38bdf8; --info-soft:rgba(56,189,248,.14);
  --shadow-1:none; --shadow-2:0 10px 30px -12px rgba(0,0,0,.6); --shadow-3:0 30px 70px -20px rgba(0,0,0,.8),0 6px 18px rgba(0,0,0,.4);
  --scrim:rgba(2,6,14,.62); --glass:rgba(11,15,23,.82);
  --card:linear-gradient(145deg,#111827,#0f172a); --side-bg:#1e2127; --hover:rgba(59,130,246,.12);
  --text-2:rgba(255,255,255,.7); --text-3:rgba(255,255,255,.6);
  --f-display:"Plus Jakarta Sans","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
  background:var(--bg);background-image:radial-gradient(900px 420px at 100% -10%,rgba(59,130,246,.10),transparent 60%);
}
body.admin-theme.admin-light{
  --bg:#f4f6fb; --bg-2:#eef2f8; --surface:#ffffff; --surface-2:#f8fafc; --sunk:#eef2f7; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --line-2:#edf1f6;
  --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:rgba(37,99,235,.10); --brass:#475569; --brass-soft:#eef2f7;
  --gold-a:#3b82f6; --gold-b:#1d4ed8;
  --ok:#16a34a; --ok-soft:rgba(22,163,74,.10); --warn:#d97706; --warn-soft:rgba(217,119,6,.12); --bad:#dc2626; --bad-soft:rgba(220,38,38,.10); --info:#0284c7; --info-soft:rgba(2,132,199,.10);
  --shadow-1:0 1px 2px rgba(15,23,42,.05); --shadow-2:0 10px 30px -12px rgba(15,23,42,.18); --shadow-3:0 30px 70px -20px rgba(15,23,42,.35);
  --scrim:rgba(15,23,42,.4); --glass:rgba(255,255,255,.85);
  --card:linear-gradient(145deg,#ffffff,#f8fafc); --side-bg:#ffffff; --hover:rgba(37,99,235,.08);
  --text-2:#475569; --text-3:#64748b; color-scheme:light;
  background-image:radial-gradient(900px 420px at 100% -10%,rgba(37,99,235,.08),transparent 60%);
}
.admin-theme .panel,.admin-theme .tile,.admin-theme .item,.admin-theme .tw,.admin-theme .stat,.admin-theme .side{background:var(--card)}
.admin-theme .panel,.admin-theme .tile,.admin-theme .tw{border-color:var(--line-2);border-radius:14px}
.admin-theme .head h1{font-size:1.5rem;font-weight:600}
.admin-theme .code{color:var(--accent-2)}
.admin-theme .flow span{background:transparent}
.admin-theme th{background:rgba(255,255,255,.03)}
.admin-theme.admin-light th{background:#f8fafc}
.admin-theme input,.admin-theme select,.admin-theme textarea{background:rgba(255,255,255,.03)}
.admin-theme.admin-light input,.admin-theme.admin-light select,.admin-theme.admin-light textarea{background:#fff}
.admin-theme .btn:not(.ghost):not(.danger-t):not(.danger):not(.ok){background:var(--accent)}
.admin-theme .nav-ind{background:var(--accent);box-shadow:0 6px 16px -8px rgba(59,130,246,.9);border-radius:9px}
.admin-theme .nav-btn:hover{background:var(--hover)}
.admin-theme .grp h4 svg.i{color:var(--accent-2)}
.admin-theme .head-ic{background:var(--accent-soft);border-color:transparent;color:var(--accent-2)}
.admin-theme .tile .ti,.admin-theme .modal-ic{background:var(--accent-soft);border-color:transparent;color:var(--accent-2)}

/* navbar */
.admin-theme .bar{height:56px;display:flex;align-items:center}
.admin-theme .bar-in{max-width:none;width:100%;padding-block:0}
.admin-theme .brand{margin-right:0;min-width:auto}
.admin-theme .logo{background:var(--accent);color:#fff;width:32px;height:32px;border-radius:9px}
.admin-theme .brand-t span{display:none}
.nav-search{position:relative;flex:1;max-width:440px;margin:0 auto 0 18px}
.nav-search svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.nav-search input{padding:7px 12px 7px 34px;border-radius:10px;background:rgba(255,255,255,.04);border-color:var(--line-2);height:36px}
.admin-light .nav-search input{background:var(--surface-2)}
.nav-search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 .7rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.sresults{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);padding:6px;display:grid;gap:2px;z-index:46;animation:modalIn .3s var(--spring);max-height:60vh;overflow:auto}
.sresults button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem}
.sresults button:hover,.sresults button.on{background:var(--hover)}
.sresults small{color:var(--muted);font-size:.74rem}
.sresults .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.sresults .ti svg.i{width:15px;height:15px}
.av-btn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:10px;padding:3px 6px 3px 3px;cursor:pointer;color:var(--ink)}
.av-btn:hover{background:var(--hover)}
.av-btn .avatar{background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;width:32px;height:32px;font-size:.9rem}
.av-btn svg.i{width:15px;height:15px;color:var(--muted);transition:transform .3s var(--spring)}
.av-btn[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.dd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:max(16px,env(safe-area-inset-right,0px));width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-3);padding:8px;z-index:46;transform-origin:top right;animation:modalIn .32s var(--spring)}
.dd.out{animation:modalOut .16s ease forwards}
.dd-h{padding:8px 10px 10px;border-bottom:1px solid var(--line-2);margin-bottom:6px;display:grid}
.dd-h small{color:var(--muted)}
.dd button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.9rem}
.dd button:hover{background:var(--hover)}
.dd button.red{color:var(--bad)}
.dd button.red:hover{background:var(--bad-soft)}

@media (min-width:901px){
  .admin-theme .shell{max-width:none;margin:0;padding:0;grid-template-columns:248px minmax(0,1fr);gap:0}
  .admin-theme .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);height:calc(100vh - 56px - env(safe-area-inset-top,0px));max-height:none;border-radius:0;border:0;border-right:1px solid var(--line-2);background:var(--side-bg);box-shadow:none;padding:14px 10px}
  .admin-theme main{padding:24px max(24px,env(safe-area-inset-right,0px)) 64px 28px}
}
.admin-theme .side{background:var(--side-bg)}
.admin-theme .grp+.grp{border-top:1px solid var(--line-2)}
.admin-theme .nav-btn{font-size:.85rem;padding:6px 9px}

/* ---- dashboard ---- */
.dash-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dash-h h1{font-size:1.6rem;font-weight:600}
.dash-h .wel{color:var(--text-2);margin:.25em 0 0;font-size:.95rem}
.dash-h .sem{color:var(--text-3);font-size:.8rem;display:flex;gap:6px;align-items:center;margin-top:2px}
.dash-h .sem svg.i{width:14px;height:14px}
.dash-h form{display:flex;gap:8px;align-items:center}
.dash-h form input{width:auto;padding:6px 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:14px;padding:18px;display:grid;gap:10px;transition:transform .2s ease,border-color .2s ease;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 60ms)}
.stat:hover{transform:translateY(-2px);border-color:rgba(59,130,246,.45)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat .sic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);transition:transform .4s var(--spring)}
.stat:hover .sic{transform:scale(1.1) rotate(-6deg)}
.stat .k{font-size:.8rem;color:var(--text-3)}
.stat .v{font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.9rem;color:var(--text-3);font-weight:500;margin-left:4px}
.chg{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.chg.warn{background:var(--warn-soft);color:var(--warn)}
.chg.bad{background:var(--bad-soft);color:var(--bad)}
.chg.neu{background:var(--brass-soft);color:var(--text-2)}
.chg svg.i{width:13px;height:13px}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.mini>div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--card);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms + 200ms)}
.mini svg.i{color:var(--accent-2);width:17px;height:17px}
.mini b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.2}
.mini small{color:var(--text-3);font-size:.72rem}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{margin:0!important;font-size:1rem!important;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h h2 svg.i{color:var(--accent-2)}
.link{border:0;background:none;color:var(--accent-2);font-size:.8rem;cursor:pointer;display:inline-flex;gap:4px;align-items:center;padding:4px 6px;border-radius:6px}
.link:hover{background:var(--hover)}
.link svg.i{width:14px;height:14px;transition:transform .3s var(--spring)}
.link:hover svg.i{transform:translateX(3px)}
.acts{display:grid}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line-2);animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 150ms)}
.act:last-child{border-bottom:0}
.act .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.act .dot.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.act .dot.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.act .dot.info{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.act b{font-weight:500;font-size:.9rem}
.act small{display:block;color:var(--text-3);font-size:.75rem}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

let LANG="th";try{LANG=localStorage.getItem(KEY+"-lang")||"th"}catch(e){}
const LOC=()=>LANG==="en"?"en-GB":"th-TH";
const EN_KEYS=Object.keys(EN).sort((a,b)=>b.length-a.length);
const THAI=/[฀-๿]/;
function trText(t){
  if(!THAI.test(t))return t;
  let s=t;
  for(const k of EN_KEYS){if(s.indexOf(k)<0)continue;const v=EN[k];s=s.split(k).join(v?"\u0001"+v+"\u0002":"")}
  s=s.replace(/\u0002\u0001/g," ").replace(/([^\s(\/·:"“\u0001])\u0001/g,"$1 ").replace(/\u0002([^\s),.:;!?\/·"”%\u0002])/g," $1").replace(/[\u0001\u0002]/g,"").replace(/ {2,}/g," ");
  return s;
}
const TR_ATTRS=["placeholder","aria-label","title","alt","data-v"];
function trNode(root){
  if(LANG!=="en"||!root)return;
  if(root.nodeType===3){if(THAI.test(root.data)&&!(root.parentElement&&root.parentElement.closest('[translate="no"],script,style')))root.data=trText(root.data);return}
  if(root.nodeType!==1||root.closest&&root.closest('[translate="no"]'))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode(n){if(n.nodeType===1)return (n.getAttribute("translate")==="no"||n.tagName==="SCRIPT"||n.tagName==="STYLE")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP;return THAI.test(n.data)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
  const list=[];let n;while((n=w.nextNode()))list.push(n);
  list.forEach(x=>x.data=trText(x.data));
  const els=[root,...root.querySelectorAll("["+TR_ATTRS.join("],[")+"]")];
  els.forEach(el=>{if(el.closest&&el.closest('[translate="no"]'))return;TR_ATTRS.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&THAI.test(v))el.setAttribute(a,trText(v))})});
}
const trObs=new MutationObserver(ms=>{if(LANG!=="en")return;ms.forEach(m=>m.addedNodes.forEach(trNode))});
trObs.observe(document.body,{childList:true,subtree:true});
const T=t=>LANG==="en"?trText(t):t;

/* ---------- toasts ---------- */
function toast(msg,kind){
  kind=kind||"ok";flashMsg={msg,kind};
  const box=$("#toasts");if(!box)return;
  while(box.children.length>=3)box.firstChild.remove();
  const t=document.createElement("div");t.className="toast "+kind;t.setAttribute("role",kind==="bad"?"alert":"status");
  t.innerHTML='<span class="ti">'+ico(kind==="bad"?"alert":kind==="info"?"bellring":"okbig")+'</span><div class="tx"><b>'+(kind==="bad"?"ทำรายการไม่สำเร็จ":kind==="info"?"แจ้งเตือน":"สำเร็จ")+"</b>"+esc(msg)+'</div><button class="x" aria-label="ปิด">'+ico("x")+'</button><span class="tb"></span>';
  const kill=()=>{if(!t.isConnected)return;t.classList.add("out");setTimeout(()=>t.remove(),240)};
  t.querySelector(".x").addEventListener("click",kill);
  let timer=setTimeout(kill,3600);
  t.addEventListener("mouseenter",()=>{clearTimeout(timer);t.querySelector(".tb").style.animationPlayState="paused"});
  t.addEventListener("mouseleave",()=>{timer=setTimeout(kill,1600);t.querySelector(".tb").style.animationPlayState="running"});
  box.appendChild(t);
}
function formErr(form,msg){
  let el=form.querySelector(".form-err");
  if(!el){el=document.createElement("div");el.className="form-err";form.insertBefore(el,form.querySelector(".actions"))}
  el.setAttribute("role","alert");el.textContent="";
  el.style.animation="none";void el.offsetWidth;el.style.animation="";
  el.innerHTML=ico("alert")+"<span>"+esc(msg)+"</span>";

function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.72))};img.onerror=()=>res(r.result);img.src=r.result};r.readAsDataURL(file)})}

/* sample QR pattern (not a real payment code) */
function qrPattern(seedStr){
  const n=25,c=document.createElement("canvas");c.width=n;c.height=n;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,n,n);x.fillStyle="#111";
  let h=0;for(const ch of seedStr)h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(rnd()>.52)x.fillRect(i,j,1,1);
  const finder=(a,b)=>{x.fillStyle="#111";x.fillRect(a,b,7,7);x.fillStyle="#fff";x.fillRect(a+1,b+1,5,5);x.fillStyle="#111";x.fillRect(a+2,b+2,3,3)};
  x.fillStyle="#fff";x.fillRect(0,0,8,8);x.fillRect(n-8,0,8,8);x.fillRect(0,n-8,8,8);finder(0,0);finder(n-7,0);finder(0,n-7);
  return c.toDataURL();
}

function calcInvoice(unitId,f){
  const u=unitById(unitId);if(!u)return null;
  const latest=t=>db.meters.filter(m=>m.Unit_ID===unitId&&m.type===t).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const w=latest("น้ำ"),e=latest("ไฟฟ้า");
  const wu=w?w.curr-w.prev:0,eu=e?e.curr-e.prev:0;
  const common=f.common!==""&&f.common!=null?Number(f.common):u.size*35;
  const water=Math.round(wu*Number(f.wrate||18)),elec=Math.round(eu*Number(f.erate||7)),other=Number(f.other||0);
  return {u,w,e,wu,eu,common,water,elec,other,total:common+water+elec+other,res:residentOf(unitId)};
}

  const due=db.invoices.filter(i=>i.Unit_ID===me.Unit_ID&&i.status==="ยังไม่ชำระ");
  const dueAmt=due.reduce((s,i)=>s+i.total,0);
  const pc=db.parcels.filter(p=>p.Unit_ID===me.Unit_ID&&p.status==="รอรับ");
  const tk=db.tickets.filter(t=>t.User_ID===me.User_ID&&t.status!=="เสร็จสิ้น"&&t.status!=="ยกเลิก");
  const bk=db.bookings.filter(b=>b.User_ID===me.User_ID&&b.status==="ยืนยันแล้ว"&&b.date>=today()).sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  const ct=db.contracts.find(c=>c.User_ID===me.User_ID&&c.status==="มีผล");
  const u=unitById(me.Unit_ID)||{};const bld=db.buildings.find(b=>b.Building_ID===u.Building_ID);
  const nl=computeNotifs();
  const stat=(i,icon,k,v,badge,goTo)=>'<button class="stat" style="--i:'+i+'" data-go="'+goTo+'"><div class="stat-top"><span class="sic">'+ico(icon)+"</span>"+badge+'</div><div><div class="k">'+esc(k)+'</div><div class="v">'+v+"</div></div></button>";
  const qa=(icon,t,sub,goTo,cnt)=>'<button data-go="'+goTo+'"><span class="qi">'+ico(icon)+"</span><span><b>"+esc(t)+"</b><br><small>"+esc(sub)+"</small></span>"+(cnt?'<span class="cnt">'+cnt+"</span>":"")+"</button>";
  const hr=new Date().getHours();const greet=hr<12?"สวัสดีตอนเช้า":hr<17?"สวัสดีตอนบ่าย":"สวัสดีตอนเย็น";
  const mine=db.invoices.filter(i=>i.Unit_ID===me.Unit_ID).slice(-3).reverse();
  return '<div class="dash-h"><div><span class="code">ห้อง '+esc(me.Unit_ID)+'</span><h1>ภาพรวมของฉัน</h1><p class="wel">'+greet+" คุณ"+esc(me.fname)+' 👋</p><div class="sem">'+ico("building")+esc(bld?bld.name:"")+" · "+esc(u.size||"")+" ตร.ม."+(ct?" · สัญญาถึง "+esc(fmtDate(ct.end)):"")+"</div></div></div>"+
  '<div class="stats">'+
   stat(0,"wallet","ยอดที่ยังไม่ชำระ",money(dueAmt)+"<small>บาท</small>",due.length?'<span class="chg bad">'+ico("alert")+"ครบกำหนด "+due.length+"</span>":'<span class="chg">'+ico("check")+"ไม่มีค้าง</span>","u1.1")+
   stat(1,"box","พัสดุรอรับ",pc.length+"<small>ชิ้น</small>",pc.length?'<span class="chg warn">'+ico("bellring")+"รอรับ</span>":'<span class="chg neu">ไม่มี</span>',"6.3")+
   stat(2,"wrench","งานซ่อมที่ยังไม่เสร็จ",tk.length+"<small>งาน</small>",tk.length?'<span class="chg warn">'+esc(tk[tk.length-1].status)+"</span>":'<span class="chg">'+ico("check")+"ไม่มีงานค้าง</span>","9.1")+
   stat(3,"calcheck","การจองที่จะถึง",bk.length+"<small>รายการ</small>",bk[0]?'<span class="chg neu">'+esc(fmtDate(bk[0].date))+"</span>":'<span class="chg neu">ไม่มี</span>',"2.1")+
  "</div>"+
  '<div class="dgrid"><section class="panel"><div class="card-h"><h2>'+ico("bell")+"การแจ้งเตือนจากระบบ</h2>"+(nl.some(x=>!x.read)?'<button class="link" data-act="readAll">อ่านทั้งหมด'+ico("check")+"</button>":"")+'</div><div class="acts">'+
   (nl.length?nl.map((n,i)=>'<div class="act" style="--i:'+i+'"><span class="dot '+(n.kind==="bad"?"bad":n.kind==="warn"?"warn":"info")+'"></span><span><b>'+(n.rawT?raw(n.text):esc(n.text))+"</b><small>"+(n.rawS?raw(n.sub):esc(n.sub))+'</small></span><span class="row-acts">'+(n.read?"":'<span class="pill info">ใหม่</span>')+'<button class="ibtn" data-act="openNotif" data-id="'+esc(n.key)+'" data-target="'+esc(n.go)+'" aria-label="เปิด" title="เปิด">'+ico("chevr")+"</button></span></div>").join(""):'<div class="empty">'+ico("bell")+"<span>ไม่มีการแจ้งเตือน</span></div>")+
  '</div></section><section class="panel"><div class="card-h"><h2>'+ico("zapfast")+'ทางลัด</h2></div><div class="qa">'+
   qa("wallet","ชำระใบแจ้งหนี้","ส่งสลิปการโอน","1.2",due.length)+qa("calplus","จองส่วนกลาง","จองฟิตเนส สระ ห้องประชุม","2.1")+qa("wrench","แจ้งซ่อม","ส่งเรื่องพร้อมรูป","9.1")+qa("pkgsearch","ติดตามพัสดุ","ดูรหัส QR รับของ","6.3",pc.length)+qa("mega","ประกาศ","ข่าวจากนิติบุคคล","u7")+qa("receipt","ดูประวัติ","รายการทั้งหมดของห้อง","u1.1")+
  "</div></section></div>"+
  '<div class="grid2"><section class="panel"><div class="card-h"><h2>'+ico("receipt")+'ใบแจ้งหนี้ล่าสุด</h2><button class="link" data-go="u1.1">ดูทั้งหมด'+ico("arrow")+"</button></div>"+
   table([{h:"เลขที่",v:i=>'<span class="mono">'+esc(i.Invoice_ID)+"</span>"},{h:"รอบบิล",v:i=>esc(monthLabel(i.round))},{h:"ยอดรวม",cls:"r",v:i=>money(i.total)},{h:"สถานะ",v:i=>pill(i.status)}],mine,"ยังไม่มีใบแจ้งหนี้")+
  '</section><section class="panel"><div class="card-h"><h2>'+ico("mega")+'ประกาศล่าสุด</h2><button class="link" data-go="u7">ดูทั้งหมด'+ico("arrow")+'</button></div><div class="acts">'+
   annSorted().slice(0,3).map((a,i)=>'<div class="act" style="--i:'+i+'"><span class="dot '+(a.priority==="ด่วน"?"bad":a.priority==="สำคัญ"?"warn":"info")+'"></span><span><b translate="no">'+esc(a.title)+"</b><small>"+esc(fmtDate(a.date))+"</small></span>"+pill(a.priority)+"</div>").join("")+
  "</div></section></div>";
}};

/* ---------- form handlers ---------- */
const H={};
H.login=fd=>{
  const u=db.users.find(x=>x.username===fd.get("username").trim()&&x.password===fd.get("password"));
  if(!u){fails++;renderLogin("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");return false}
  me=u;fails=0;try{sessionStorage.setItem(KEY+"-me",u.User_ID)}catch(e){}
  log("เข้าสู่ระบบ","บัญชีผู้ใช้",u.User_ID);save();
  view=u.role==="admin"?"8.1":"home";render();return false;
};
H.month=fd=>{sel.month=fd.get("month")||thisMonth()};
H.search=fd=>{sel.q=fd.get("q")};
H.bld=fd=>{sel.bld=fd.get("bld")};
H.logT=fd=>{sel.logT=fd.get("t")};
H.pickUser=fd=>{sel.user=fd.get("id")};
H.pickUnit=fd=>{sel.unit=fd.get("id")};
H.pickAnn=fd=>{sel.ann=fd.get("id")};
H["1.1"]=(fd,form,live)=>{
  const f={unit:fd.get("unit"),round:fd.get("round"),common:fd.get("common"),wrate:fd.get("wrate"),erate:fd.get("erate"),other:fd.get("other")};
  sel.inv=f;if(live)return;
  const c=calcInvoice(f.unit,f);if(!c||!c.res)return;
  if(db.invoices.find(i=>i.Unit_ID===f.unit&&i.round===f.round)){toast("ห้องนี้มีใบแจ้งหนี้รอบนี้แล้ว","bad");return}
  const id=invoiceId(f.round);
  db.invoices.push({Invoice_ID:id,Unit_ID:f.unit,User_ID:c.res.User_ID,round:f.round,common:c.common,water:c.water,elec:c.elec,other:c.other,total:c.total,status:"ยังไม่ชำระ"});
  log("สร้าง","ใบแจ้งหนี้",id);sel.inv=null;sel.hl=id;toast("บันทึกใบแจ้งหนี้ "+id+" แล้ว");
};
H["1.2"]=(fd,form,live)=>{
  sel.pay=fd.get("inv");if(live)return;
  if(!form.dataset.slip){formErr(form,"กรุณาแนบหลักฐานการโอนเงิน");return false}
  const inv=db.invoices.find(i=>i.Invoice_ID===sel.pay);if(!inv)return;
  const id=nextId("PAY",db.payments,"Payment_ID");
  db.payments.push({Payment_ID:id,Invoice_ID:inv.Invoice_ID,at:fd.get("at"),channel:fd.get("channel"),slip:form.dataset.slip,verify:"รอตรวจสอบ"});
  inv.status="รอตรวจสอบ";log("แจ้งชำระ","การชำระเงิน",id);sel.pay=null;sel.hl=inv.Invoice_ID;toast("ส่งหลักฐานการชำระเงินเรียบร้อย");view="u1.1";
};
H["2.1"]=(fd,form,live)=>{
  const f={fac:fd.get("fac"),date:fd.get("date"),slot:fd.get("slot")};sel.book=f;if(live)return;
  const fac=facById(f.fac);
  const n=db.bookings.filter(b=>b.Facility_ID===f.fac&&b.date===f.date&&b.slot===f.slot&&b.status!=="ยกเลิก").length;
  if(n>=fac.capacity){toast("ช่วงเวลานี้เต็มแล้ว กรุณาเลือกช่วงอื่น","bad");return}
  if(db.bookings.find(b=>b.User_ID===me.User_ID&&b.Facility_ID===f.fac&&b.date===f.date&&b.slot===f.slot&&b.status!=="ยกเลิก")){toast("คุณจองช่วงเวลานี้ไว้แล้ว","bad");return}
  const id=nextId("BK",db.bookings,"Booking_ID");
  db.bookings.push({Booking_ID:id,Facility_ID:f.fac,Unit_ID:me.Unit_ID,User_ID:me.User_ID,date:f.date,slot:f.slot,status:"ยืนยันแล้ว"});
  log("จอง","การจองส่วนกลาง",id);sel.hl=id;toast("จอง "+fac.name+" สำเร็จ ("+id+")");
};
function residentData(fd){return {fname:fd.get("fname").trim(),lname:fd.get("lname").trim(),phone:fd.get("phone").trim(),email:fd.get("email").trim(),idcard:fd.get("idcard").trim(),Unit_ID:fd.get("unit"),username:fd.get("username").trim(),password:fd.get("password")}}
H["3.2"]=fd=>{
  const d=residentData(fd);
  if(db.users.find(u=>u.username===d.username)){toast("username นี้ถูกใช้แล้ว","bad");return false}
  const id=nextId("USR",db.users,"User_ID");db.users.push(Object.assign({User_ID:id,role:"resident"},d));
  log("เพิ่ม","ผู้อยู่อาศัย",id);sel.hl=id;toast("เพิ่ม "+d.fname+" ("+id+") แล้ว");view="3.1";
};
H["3.3"]=fd=>{
  const u=userById(fd.get("id"));const d=residentData(fd);
  if(db.users.find(x=>x.username===d.username&&x.User_ID!==u.User_ID)){toast("username นี้ถูกใช้แล้ว","bad");return false}
  Object.assign(u,d);log("แก้ไข","ผู้อยู่อาศัย",u.User_ID);sel.hl=u.User_ID;toast("บันทึกข้อมูล "+u.User_ID+" แล้ว");
};
function unitData(fd){const id=(fd.get("Unit_ID")||"").trim();return {Building_ID:fd.get("Building_ID"),no:fd.get("no").trim()||id.replace(/^[^-]*-/,""),floor:Number(fd.get("floor")),size:Number(fd.get("size")),status:fd.get("status")}}
H["4.2"]=(fd,form)=>{
  const id=fd.get("Unit_ID").trim().toUpperCase();if(db.units.some(u=>u.Unit_ID.toUpperCase()===id)){formErr(form,"Unit_ID นี้มีอยู่ในระบบแล้ว");return false}
  db.units.push(Object.assign({Unit_ID:id},unitData(fd)));log("เพิ่ม","ห้องชุด",id);sel.hl=id;view="4.1";sel.bld="";toast("เพิ่มข้อมูลห้องสำเร็จ");
};
H["4.3"]=fd=>{const u=unitById(fd.get("Unit_ID"));Object.assign(u,unitData(fd));log("แก้ไข","ห้องชุด",u.Unit_ID);sel.hl=u.Unit_ID;toast("บันทึกห้อง "+u.Unit_ID+" แล้ว")};
H["5.1"]=(fd,form)=>{
  const unit=fd.get("unit"),user=fd.get("user");
  if(fd.get("end")<=fd.get("start")){toast("วันสิ้นสุดต้องอยู่หลังวันเริ่มสัญญา","bad");return false}
  const id=nextId("CT",db.contracts,"Contract_ID");
  db.contracts.push({Contract_ID:id,Unit_ID:unit,User_ID:user,type:fd.get("type"),start:fd.get("start"),end:fd.get("end"),img:form.dataset.img||"",status:"มีผล"});
  unitById(unit).status="มีผู้เช่า";userById(user).Unit_ID=unit;
  log("สร้าง","สัญญาเช่า",id);sel.hl=id;toast("สร้างสัญญา "+id+" แล้ว");
};
H["6.1"]=fd=>{
  const id=nextId("PC",db.parcels,"Parcel_ID");
  const code="QR-"+id+"-"+Math.random().toString(16).slice(2,6).toUpperCase();
  db.parcels.push({Parcel_ID:id,Unit_ID:fd.get("unit"),carrier:fd.get("carrier"),tracking:fd.get("tracking").trim(),inAt:fd.get("inAt"),status:"รอรับ",code,pickedAt:""});
  log("เพิ่ม","พัสดุ",id);sel.hl=id;toast("บันทึกพัสดุ "+id+" และแจ้งเตือนห้อง "+fd.get("unit")+" แล้ว");
};
function annData(fd,form,old){const d={title:fd.get("title").trim(),detail:fd.get("detail").trim(),priority:fd.get("priority")};if(form.dataset.fileName){d.fileName=form.dataset.fileName;d.file=form.dataset.file||""}else if(old){d.fileName=old.fileName;d.file=old.file}else{d.fileName="";d.file=""}return d}
H["7.1"]=(fd,form)=>{const id=nextId("AN",db.announcements,"AN_ID");db.announcements.push(Object.assign({AN_ID:id,date:today()},annData(fd,form)));log("สร้าง","ประกาศ",id);sel.hl=id;toast("ประกาศ "+id+" แล้ว")};
H["7.2"]=(fd,form)=>{const a=db.announcements.find(x=>x.AN_ID===fd.get("id"));Object.assign(a,annData(fd,form,a));log("แก้ไข","ประกาศ",a.AN_ID);sel.hl=a.AN_ID;toast("บันทึกประกาศ "+a.AN_ID+" แล้ว")};
H.tkStatus=fd=>{const t=db.tickets.find(x=>x.Ticket_ID===fd.get("id"));t.status=fd.get("status");log("อัปเดตสถานะ: "+t.status,"แจ้งซ่อม",t.Ticket_ID);sel.hl=t.Ticket_ID;toast(t.Ticket_ID+" → "+t.status)};
H["9.1"]=(fd,form)=>{
  const id=nextId("TK",db.tickets,"Ticket_ID");
  db.tickets.push({Ticket_ID:id,Unit_ID:me.Unit_ID,User_ID:me.User_ID,category:fd.get("category"),place:fd.get("place").trim(),detail:fd.get("detail").trim(),cause:fd.get("cause").trim(),causeDate:fd.get("causeDate"),causeTime:fd.get("causeTime"),img:form.dataset.img||"",date:nowLocal(),status:"รับเรื่อง"});
  log("แจ้งซ่อม","แจ้งซ่อม",id);sel.hl=id;toast("ส่งเรื่องแล้ว หมายเลขการซ่อม "+id);
};
H["10.1"]=fd=>{const id=nextId("VS",db.visitors,"Visitor_ID");db.visitors.push({Visitor_ID:id,Unit_ID:fd.get("unit"),name:fd.get("name").trim(),plate:fd.get("plate").trim(),inAt:fd.get("inAt"),outAt:""});log("เพิ่ม","ผู้มาติดต่อ",id);sel.hl=id;toast("บันทึก "+id+" แล้ว")};

/* ---------- actions ---------- */
const A={
  logout(){closeDD(true);log("ออกจากระบบ","บัญชีผู้ใช้",me.User_ID);save();me=null;sel={};lastUnread=-1;closeNotif(true);closeModal(true);try{sessionStorage.removeItem(KEY+"-me")}catch(e){}render();return "noop"},
  fill(id){const u=userById(id);$("#f-username").value=u.username;$("#f-password").value=u.password;return "noop"},
  reset(){db=seed();save();sel={};lastUnread=-1;if(me){me=userById(me.User_ID)||null}if(me&&!V[view])view=me.role==="admin"?"8.1":"home";render();toast("รีเซ็ตข้อมูลตัวอย่างแล้ว","info");return "noop"},
  navToggle(){document.body.classList.toggle("nav-open");return "noop"},
  navClose(){document.body.classList.remove("nav-open");return "noop"},
  bell(){closeDD(true);toggleNotif();return "noop"},
  avatar(){closeNotif(true);toggleDD();return "noop"},
  sideMini(){const v=!uiPref().mini;setPref("mini",v);document.body.classList.toggle("side-mini",v);const b=document.querySelector(".mini-btn");if(b){b.innerHTML=ico(v?"popen":"pclose");b.setAttribute("aria-label",v?"ขยายเมนู":"พับเมนู");b.title=v?"ขยายเมนู":"พับเมนู";trNode(b)}setTimeout(moveInd,360);return "noop"},
  grpToggle(id){const sh=new Set(uiPref().shut||[]);const g=document.querySelector('.grp[data-grp="'+CSS.escape(id)+'"]');const close=!sh.has(id);if(close)sh.add(id);else sh.delete(id);setPref("shut",[...sh]);if(g){g.classList.toggle("shut",close);g.querySelector(".grp-h").setAttribute("aria-expanded",String(!close))}const t0=performance.now();const f=()=>{moveInd();if(performance.now()-t0<380)requestAnimationFrame(f)};requestAnimationFrame(f);return "noop"},
  fold(id){const f=new Set(uiPref().fold||[]);if(f.has(id))f.delete(id);else f.add(id);setPref("fold",[...f]);const p=document.querySelector('#main .panel[data-fold="'+CSS.escape(id)+'"]');if(p){p.classList.toggle("folded",f.has(id));p.querySelector(".fold-btn").setAttribute("aria-expanded",String(!f.has(id)))}return "noop"},
  lang(){LANG=LANG==="en"?"th":"en";try{localStorage.setItem(KEY+"-lang",LANG)}catch(e){}closeDD(true);closeNotif(true);render();toast(LANG==="en"?"Language: English":"ภาษา: ไทย","info");return "noop"},
  theme(){const l=!adminLight();try{localStorage.setItem(KEY+"-adm-theme",l?"light":"dark")}catch(e){}closeDD(true);document.body.classList.toggle("admin-light",l);document.querySelectorAll('.bar [data-act="theme"],.login-tools [data-act="theme"]').forEach(tb=>tb.innerHTML=ico(l?"moon":"sun"));if(me)renderMain(false);toast(l?"เปลี่ยนเป็นธีมสว่างแล้ว":"เปลี่ยนเป็นธีมมืดแล้ว","info");return "noop"},
  readAll(){markSeen(computeNotifs().map(x=>x.key));lastUnread=-1;updateBell();return "noop"},
  approve(id){const p=db.payments.find(x=>x.Payment_ID===id);p.verify="อนุมัติ";const i=db.invoices.find(x=>x.Invoice_ID===p.Invoice_ID);if(i)i.status="ชำระแล้ว";log("อนุมัติ","การชำระเงิน",id);sel.hl=id;toast(p.Invoice_ID+" ชำระแล้ว")},
  reject(id){const p=db.payments.find(x=>x.Payment_ID===id);p.verify="ไม่อนุมัติ";const i=db.invoices.find(x=>x.Invoice_ID===p.Invoice_ID);if(i)i.status="ยังไม่ชำระ";log("ไม่อนุมัติ","การชำระเงิน",id);sel.hl=id;toast(p.Invoice_ID+" กลับเป็นยังไม่ชำระ","info")},
  slip(id){const p=db.payments.find(x=>x.Payment_ID===id);showImg(p&&p.slip);return "noop"},
  contractImg(id){const c=db.contracts.find(x=>x.Contract_ID===id);showImg(c&&c.img);return "noop"},
  ticketImg(id){const t=db.tickets.find(x=>x.Ticket_ID===id);showImg(t&&t.img);return "noop"},
  payInv(id){sel.pay=id;go("1.2");return "noop"},
  editUser(id){openModal({icon:"userpen",title:"แก้ไขข้อมูลผู้อยู่อาศัย · "+id,body:residentForm(userById(id),"3.3")});return "noop"},
  toDelUser(){go("3.4");return "noop"},
  delUser(id){db.users=db.users.filter(u=>u.User_ID!==id);log("ลบ","ผู้อยู่อาศัย",id);toast("ลบผู้อยู่อาศัย "+id+" แล้ว")},
  editUnit(id){openModal({icon:"pen",title:"แก้ไขข้อมูลห้อง · "+id,body:unitForm(unitById(id),"4.3")});return "noop"},
  delUnit(id){db.units=db.units.filter(u=>u.Unit_ID!==id);log("ลบ","ห้องชุด",id);toast("ลบห้อง "+id+" แล้ว")},
  cancelContract(id){const c=db.contracts.find(x=>x.Contract_ID===id);c.status="ยกเลิก";const u=unitById(c.Unit_ID);if(u)u.status="ว่าง";log("ยกเลิก","สัญญาเช่า",id);sel.hl=id;toast("ยกเลิกสัญญา "+id+" แล้ว")},
  delParcel(id){db.parcels=db.parcels.filter(p=>p.Parcel_ID!==id);log("ลบ","พัสดุ",id);toast("ลบพัสดุ "+id+" แล้ว")},
  pick(id){const p=db.parcels.find(x=>x.Parcel_ID===id);p.status="รับแล้ว";p.pickedAt=nowLocal();log("รับพัสดุ","พัสดุ",id);sel.hl=id;toast("บันทึกการรับ "+id+" แล้ว")},
  editAnn(id){openModal({icon:"edit",title:"แก้ไขประกาศ · "+id,body:annForm(db.announcements.find(a=>a.AN_ID===id),"7.2")});return "noop"},
  delAnn(id){db.announcements=db.announcements.filter(a=>a.AN_ID!==id);log("ลบ","ประกาศ",id);toast("ลบประกาศ "+id+" แล้ว")},
  cancelTicket(id){const t=db.tickets.find(x=>x.Ticket_ID===id);t.status="ยกเลิก";log("ยกเลิก","แจ้งซ่อม",id);sel.hl=id;toast("ยกเลิก "+id+" แล้ว")},
  cancelBooking(id){const b=db.bookings.find(x=>x.Booking_ID===id);b.status="ยกเลิก";log("ยกเลิก","การจองส่วนกลาง",id);sel.hl=id;toast("ยกเลิกการจอง "+id+" แล้ว")},
  visitorOut(id){const v=db.visitors.find(x=>x.Visitor_ID===id);v.outAt=nowLocal();log("บันทึกเวลาออก","ผู้มาติดต่อ",id);sel.hl=id;toast("บันทึกเวลาออก "+id+" แล้ว")}
};
A.openNotif=function(key,btn){markSeen([key]);lastUnread=-1;closeNotif(true);go(btn.dataset.target);return "noop"};
const REMOVES={delUser:1,delUnit:1,delParcel:1,delAnn:1};
const CONFIRM={
  reset:()=>["รีเซ็ตข้อมูลตัวอย่าง?","ข้อมูลทั้งหมดที่เพิ่มหรือแก้ไขจะถูกแทนที่ด้วยข้อมูลตัวอย่างชุดเริ่มต้น","รีเซ็ตข้อมูล"],
  reject:id=>["ไม่อนุมัติการชำระ "+id+"?","ใบแจ้งหนี้จะกลับไปเป็นสถานะ <b>ยังไม่ชำระ</b> และผู้อยู่อาศัยต้องส่งหลักฐานใหม่","ไม่อนุมัติ"],
  delUser:id=>{const u=userById(id);return ["ลบผู้อยู่อาศัย?","<b>"+esc(fullName(u))+"</b> ("+esc(id)+") ห้อง "+esc(u&&u.Unit_ID||"-")+" จะถูกลบออกจาก D1 และเข้าสู่ระบบไม่ได้อีก","ลบผู้อยู่อาศัย"]},
  delUnit:id=>["ลบห้อง "+id+"?","ห้องนี้จะถูกลบออกจาก D2 การลบย้อนกลับไม่ได้","ลบห้อง"],
  cancelContract:id=>["ยกเลิกสัญญา "+id+"?","สัญญาจะเปลี่ยนเป็นสถานะยกเลิก และห้องจะกลับเป็น <b>ว่าง</b>","ยกเลิกสัญญา"],
  delParcel:id=>["ลบพัสดุ "+id+"?","ข้อมูลพัสดุนี้จะถูกลบออกจาก D5","ลบพัสดุ"],
  delAnn:id=>{const a=db.announcements.find(x=>x.AN_ID===id);return ["ลบประกาศ?","<b>"+esc(a?a.title:id)+"</b> จะหายไปจากหน้าประกาศของผู้อยู่อาศัยทุกคน","ลบประกาศ"]},
  cancelTicket:id=>["ยกเลิกการแจ้งซ่อม "+id+"?","งานซ่อมจะเปลี่ยนเป็นสถานะยกเลิก","ยกเลิกงานซ่อม"],
  cancelBooking:id=>{const b=db.bookings.find(x=>x.Booking_ID===id);return ["ยกเลิกการจอง?",esc((facById(b.Facility_ID)||{}).name)+" วันที่ "+esc(fmtDate(b.date))+" เวลา "+esc(b.slot),"ยกเลิกการจอง"]}
};
function runAct(act,id,btn){
  const br=btn&&btn.isConnected?btn.getBoundingClientRect():null;
  const r=A[act](id,btn);
  if(r!=="noop"&&br&&flashMsg&&flashMsg.kind==="ok"&&br.width)burst(br.left+br.width/2,br.top+br.height/2);
  if(r==="noop")return;
  save();renderMain(false);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(notifEl&&!e.target.closest(".notif")&&!e.target.closest("#bell"))closeNotif();
  if(ddEl&&!e.target.closest(".dd")&&!e.target.closest("#avbtn"))closeDD();
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();closeModal();go(g.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  e.preventDefault();
  const act=b.dataset.act,id=b.dataset.id;
  if(!A[act])return;
  if(b.dataset.confirm){
    const c=(CONFIRM[act]||(()=>["ยืนยันการทำรายการ?","",b.textContent.trim()]))(id);
    confirmModal(c[0],c[1],c[2],()=>{
      flashMsg=null;
      const row=REMOVES[act]&&document.querySelector('#main [data-row="'+CSS.escape(id)+'"],#main [data-ann="'+CSS.escape(id)+'"]');
      if(row){row.classList.add("leaving");setTimeout(()=>runAct(act,id,b),230)}else runAct(act,id,b);
    });
    return;
  }
  if(!["bell","avatar","theme","sideMini","grpToggle","fold","lang","navToggle","navClose","readAll","openNotif","fill","slip","contractImg","ticketImg"].includes(act))flashMsg=null;
  runAct(act,id,b);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDD();if(modalEl)closeModal();else if(notifEl)closeNotif();document.body.classList.remove("nav-open")}});
document.addEventListener("submit",e=>{
  const form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();
  const h=H[form.dataset.form];if(!h)return;
  flashMsg=null;const fe=form.querySelector(".form-err");if(fe)fe.innerHTML="";
  const inModal=!!form.closest(".overlay");
  const before=view;
  const sub=e.submitter||form.querySelector("[type=submit]");const sr=sub?sub.getBoundingClientRect():null;
  const r=h(new FormData(form),form,false);
  if(r!==false&&sr&&flashMsg&&flashMsg.kind==="ok"&&form.dataset.form!=="login")burst(sr.left+sr.width/2,sr.top+sr.height/2);
  if(form.dataset.form==="login")return;
  if(r===false)return;
  if(inModal)closeModal();
  save();
  const moved=view!==before;
  if(moved){try{sessionStorage.setItem(KEY+"-view",view)}catch(err){}window.scrollTo({top:0,behavior:"smooth"})}
  renderMain(moved);
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.img){const form=el.closest("form");const file=el.files[0];if(!file)return;
    try{const url=await resizeImage(file);form.dataset[el.dataset.img]=url;let p=el.parentNode.querySelector("img.preview-img");if(p)p.remove();p=document.createElement("img");p.className="preview-img";p.alt="ตัวอย่างรูปที่แนบ";p.src=url;el.parentNode.appendChild(p);const s=el.parentNode.querySelector("[data-prev]");if(s)s.remove();const fe=form.querySelector(".form-err");if(fe)fe.innerHTML=""}catch(err){toast("อ่านไฟล์รูปไม่ได้ ลองไฟล์อื่น","bad")}return}
  if(el.dataset&&el.dataset.doc){const form=el.closest("form");const file=el.files[0];if(!file)return;form.dataset.fileName=file.name;
    if(file.size<300000){const r=new FileReader();r.onload=()=>{form.dataset.file=r.result};r.readAsDataURL(file)}else form.dataset.file="";return}
  const form=el.closest&&el.closest('form[data-live]');if(!form)return;
  const h=H[form.dataset.form];if(!h)return;
  const keep=form.dataset.slip;h(new FormData(form),form,true);
  renderMain(false);
  if(keep&&form.dataset.form==="1.2"){const f=document.querySelector('form[data-form="1.2"]');if(f){f.dataset.slip=keep;const i=f.querySelector('[data-img="slip"]');if(i){const p=document.createElement("img");p.className="preview-img";p.alt="ตัวอย่างรูปที่แนบ";p.src=keep;i.parentNode.appendChild(p)}}}
});

/* ---------- boot ---------- */
load();
try{const id=sessionStorage.getItem(KEY+"-me");if(id){me=userById(id)||null;const v=sessionStorage.getItem(KEY+"-view");view=me&&v&&V[v]&&NAV[me.role].some(g=>g.items.some(i=>i[0]===v))?v:(me?(me.role==="admin"?"8.1":"home"):null)}}catch(e){}
render();
})();
</script>

</body>
