<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Condo UTS — Unit and Tenant Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* ========================================================
   CONDO UTS — ULTRA MODERN DESIGN SYSTEM (2026 EDITION)
   Dark-first luxury PropTech theme with crisp Light Mode
   ======================================================== */

:root {
  /* Dark Mode Palette (Default) */
  --bg: #090d16;
  --bg-2: #0f172a;
  --surface: #131c2e;
  --surface-2: #1a263d;
  --surface-card: rgba(19, 28, 46, 0.78);
  --surface-glass: rgba(15, 23, 42, 0.85);
  --sunk: #0a1120;
  --line: rgba(255, 255, 255, 0.10);
  --line-2: rgba(255, 255, 255, 0.06);
  --ink: #f8fafc;
  --muted: #94a3b8;
  --muted-2: #64748b;
  
  /* Brand Accents */
  --accent: #3b82f6;
  --accent-2: #60a5fa;
  --accent-ink: #ffffff;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --accent-glow: rgba(59, 130, 246, 0.35);
  --hover: rgba(59, 130, 246, 0.12);
  
  /* Status Colors */
  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.14);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --bad: #ef4444;
  --bad-soft: rgba(239, 68, 68, 0.14);
  --info: #0ea5e9;
  --info-soft: rgba(14, 165, 233, 0.14);
  --purple: #8b5cf6;
  --purple-soft: rgba(139, 92, 246, 0.14);

  /* Shadows & Depth */
  --shadow-1: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-2: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  --shadow-3: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  --scrim: rgba(4, 7, 14, 0.72);
  --glass: blur(14px);

  /* Radii & Typography */
  --f-display: "Plus Jakarta Sans", "Noto Sans Thai", system-ui, sans-serif;
  --f-body: "Inter", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 10px;
  --r-lg: 22px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.22, 0.8, 0.26, 1);
  color-scheme: dark;
}

/* Light Mode Palette */
:root[data-theme="light"], body.admin-light {
  --bg: #f8fafc;
  --bg-2: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-card: rgba(255, 255, 255, 0.95);
  --surface-glass: rgba(255, 255, 255, 0.88);
  --sunk: #edf2f7;
  --line: #e2e8f0;
  --line-2: #edf2f7;
  --ink: #0f172a;
  --muted: #64748b;
  --muted-2: #94a3b8;
  
  --accent: #2563eb;
  --accent-2: #3b82f6;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --accent-glow: rgba(37, 99, 235, 0.25);
  --hover: rgba(37, 99, 235, 0.06);
  
  --ok: #059669;
  --ok-soft: rgba(5, 150, 105, 0.10);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.10);
  --bad: #dc2626;
  --bad-soft: rgba(220, 38, 38, 0.10);
  --info: #0284c7;
  --info-soft: rgba(2, 132, 199, 0.10);
  --purple: #7c3aed;
  --purple-soft: rgba(124, 58, 237, 0.10);

  --shadow-1: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-2: 0 10px 25px -5px rgba(15, 23, 42, 0.10), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  --shadow-3: 0 25px 50px -12px rgba(15, 23, 42, 0.20);
  --scrim: rgba(15, 23, 42, 0.45);
  color-scheme: light;
}

/* Base Styles */
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(1200px 500px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, var(--hover), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--surface);
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
  line-height: 1.25;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.85em; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pad { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Top Bar Header ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface-glass);
  backdrop-filter: var(--glass) saturate(1.5);
  -webkit-backdrop-filter: var(--glass) saturate(1.5);
  border-bottom: 1px solid var(--line-2);
  height: 60px;
  display: flex;
  align-items: center;
}
.bar-in {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: none;
  margin: 0;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
}
.logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), #1d4ed8);
  display: grid;
  place-items: center;
  color: #fff;
  box-shadow: 0 4px 14px -3px var(--accent-glow);
  flex: none;
  transition: transform 0.3s var(--spring);
}
.brand:hover .logo { transform: rotate(-8deg) scale(1.06); }
.logo svg.i { width: 20px; height: 20px; }
.brand-t { display: grid; line-height: 1.2; }
.brand-t b { font-family: var(--f-display); font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
.brand-t span { color: var(--muted); font-size: 0.74rem; font-weight: 500; }

.nav-search {
  position: relative;
  flex: 1;
  max-width: 440px;
  margin: 0 auto 0 16px;
}
.nav-search svg.i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  width: 16px;
  height: 16px;
}
.nav-search input {
  width: 100%;
  padding: 8px 36px 8px 36px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  height: 38px;
  font-size: 0.88rem;
  transition: all 0.2s ease;
}
.nav-search input:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.nav-search kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font: 500 0.7rem var(--f-mono);
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
  pointer-events: none;
}

.sresults {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 8px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-3);
  padding: 6px;
  display: grid;
  gap: 3px;
  z-index: 55;
  animation: modalIn 0.25s var(--spring);
  max-height: 65vh;
  overflow: auto;
}
.sresults button {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  border: 0;
  background: none;
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: background 0.15s;
}
.sresults button:hover, .sresults button.on { background: var(--hover); }
.sresults .ti {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-2);
}
.sresults small { color: var(--muted); font-size: 0.74rem; }

.who { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.lang-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 11px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
  font: 600 0.78rem var(--f-display);
  transition: all 0.2s;
}
.lang-btn:hover { background: var(--hover); border-color: var(--accent); }
.lang-btn svg.i { width: 16px; height: 16px; color: var(--accent-2); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
.lang-btn:hover svg.i { transform: scale(1.22) rotate(6deg); }

.icon-btn {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.icon-btn svg.i { transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
.icon-btn:hover { background: var(--hover); border-color: var(--line); transform: translateY(-2px); box-shadow: var(--shadow-1); }
.icon-btn:hover svg.i { transform: scale(1.22) rotate(6deg); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn:active svg.i { transform: scale(0.88); }
.badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--bad);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--surface);
  box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
}
.menu-btn { display: none; }

.av-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  border-radius: 12px;
  padding: 3px 10px 3px 4px;
  cursor: pointer;
  color: var(--ink);
  transition: all 0.2s;
}
.av-btn:hover { background: var(--hover); border-color: var(--line); }
.av-btn .avatar {
  background: linear-gradient(135deg, var(--accent), #1d4ed8);
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-family: var(--f-display);
  font-size: 0.92rem;
}
.who-t { display: grid; line-height: 1.15; font-size: 0.86rem; text-align: left; }
.who-t small { color: var(--muted); font-size: 0.72rem; }
.av-btn svg.gc { width: 14px; height: 14px; color: var(--muted); transition: transform 0.25s; }
.av-btn[aria-expanded="true"] svg.gc { transform: rotate(180deg); }

/* User dropdown */
.dd {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 260px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-3);
  padding: 8px;
  z-index: 55;
  transform-origin: top right;
  animation: modalIn 0.25s var(--spring);
}
.dd.out { animation: modalOut 0.16s ease forwards; }
.dd-h { padding: 10px 12px 12px; border-bottom: 1px solid var(--line-2); margin-bottom: 6px; display: grid; }
.dd-h b { font-size: 0.95rem; }
.dd-h small { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.dd button {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: background 0.15s;
}
.dd button:hover { background: var(--hover); }
.dd button.red { color: var(--bad); }
.dd button.red:hover { background: var(--bad-soft); }

/* ---------- Shell & Sidebar Layout ---------- */
:root {
  --side-w: 290px;
}
.shell {
  display: flex;
  align-items: stretch;
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  min-height: calc(100vh - 60px);
}
.side {
  width: var(--side-w, 290px);
  min-width: 200px;
  max-width: 650px;
  flex: none;
  align-self: stretch;
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 60px);
  height: calc(100vh - 60px - env(safe-area-inset-top, 0px));
  max-height: none;
  overflow-y: auto;
  background: var(--surface-card);
  border: 0;
  border-right: 1px solid var(--line-2);
  border-radius: 0;
  padding: 16px 10px;
  box-shadow: none;
  scrollbar-width: thin;
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
}
.side-resizer {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 60px);
  height: calc(100vh - 60px - env(safe-area-inset-top, 0px));
  width: 6px;
  margin-left: -3px;
  margin-right: -3px;
  cursor: col-resize;
  z-index: 25;
  background: transparent;
  flex: none;
  transition: background 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.side-resizer::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 36px;
  border-radius: 99px;
  background: var(--line-2);
  transition: all 0.2s ease;
}
.side-resizer:hover,
body.is-resizing .side-resizer,
.side-resizer:focus-visible {
  background: rgba(59, 130, 246, 0.2);
  outline: none;
}
.side-resizer:hover::after,
body.is-resizing .side-resizer::after,
.side-resizer:focus-visible::after {
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  height: 52px;
  width: 3px;
}
body.is-resizing {
  cursor: col-resize !important;
  user-select: none !important;
}
body.is-resizing * {
  cursor: col-resize !important;
  user-select: none !important;
}
body.side-mini .side {
  width: 72px !important;
  min-width: 72px !important;
  max-width: 72px !important;
  padding-inline: 8px;
}
body.side-mini .side-resizer {
  display: none !important;
}
.grp { padding: 4px 0 8px; }
.grp + .grp { border-top: 1px solid var(--line-2); padding-top: 10px; margin-top: 4px; }
.grp-h {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  background: none;
  color: var(--muted);
  cursor: pointer;
  padding: 7px 10px;
  border-radius: 10px;
  font: 700 0.75rem var(--f-display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-align: left;
  transition: color 0.15s, background 0.15s;
}
.grp-h:hover { color: var(--ink); background: var(--hover); }
.grp-h svg.i { width: 15px; height: 15px; color: var(--accent-2); flex: none; }
.grp-h .gt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-h svg.gc { color: var(--muted-2); transition: transform 0.25s var(--spring); }
.grp.shut .grp-h svg.gc { transform: rotate(-90deg); }
.grp-b { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.28s var(--ease); }
.grp-b > div { overflow: hidden; min-height: 0; display: grid; gap: 2px; }
.grp.shut .grp-b { grid-template-rows: 0fr; }

.nav-btn {
  position: relative;
  display: flex;
  gap: 9px;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 500;
  transition: all 0.18s ease;
}
.nav-btn .ni { display: grid; place-items: center; width: 20px; color: var(--muted); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease; }
.nav-btn:hover { background: var(--hover); color: var(--ink); }
.nav-btn:hover .ni { color: var(--accent); transform: scale(1.24) rotate(-6deg); }
.nav-btn[aria-current="page"] {
  background: linear-gradient(135deg, var(--accent), #1d4ed8);
  color: #fff !important;
  box-shadow: 0 4px 14px -3px var(--accent-glow);
  font-weight: 600;
}
.nav-btn[aria-current="page"] .ni { color: #fff !important; }
.nav-btn .mono {
  font-size: 0.72rem;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 1px 5px;
  color: inherit;
  opacity: 0.85;
}
.nav-btn[aria-current="page"] .mono { background: rgba(255, 255, 255, 0.2); border-color: transparent; opacity: 1; }
.nav-btn .nl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-pill {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--bad);
  color: #fff;
  margin-left: auto;
}

/* Sidebar Mini (Rail) */
body.side-mini .side { padding-inline: 8px; }
body.side-mini .grp-h { display: none; }
body.side-mini .grp { padding: 4px 0; }
body.side-mini .nav-btn { justify-content: center; padding: 10px 0; }
body.side-mini .nav-btn .mono, body.side-mini .nav-btn .nl, body.side-mini .nav-pill { display: none; }
body.side-mini .grp.shut .grp-b { grid-template-rows: 1fr; }

/* ---------- Main Surface & Headers ---------- */
main {
  flex: 1 1 0%;
  min-width: 0;
  width: 100%;
  display: grid;
  gap: 22px;
  align-content: start;
  padding: 24px max(28px, env(safe-area-inset-right, 0px)) 64px 28px;
}
.head {
  display: flex;
  gap: 16px;
  align-items: center;
  background: var(--surface-card);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  padding: 18px 22px;
  box-shadow: var(--shadow-1);
}
.head-ic {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-2);
  border: 1px solid var(--accent-soft);
  flex: none;
}
.head-ic svg.i { width: 24px; height: 24px; }
.head-t { display: grid; gap: 4px; min-width: 0; }
.code { font-family: var(--f-mono); font-size: 0.75rem; color: var(--accent-2); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.head h1 { font-size: 1.55rem; }
.flow { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; }
.flow span { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px 10px; }
.flow b { color: var(--ink); font-weight: 600; }

/* Panels & Cards */
.panel {
  background: var(--surface-card);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  padding: 22px;
  min-width: 0;
  box-shadow: var(--shadow-1);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.panel:hover { border-color: var(--line); }
.panel h2 { font-size: 1.12rem; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-h h2 { margin: 0 !important; font-size: 1.05rem !important; }
.card-h h2 svg.i { color: var(--accent-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 20px; align-items: start; }

.fold-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  margin-left: auto;
  transition: all 0.2s;
}
.fold-btn:hover { background: var(--hover); color: var(--ink); }
.panel.folded .fold-btn svg.i { transform: rotate(-90deg); }
.panel.folded > :not(.card-h) { display: none; }
.panel.folded .card-h { margin-bottom: 0; }

/* ---------- Stat Cards & Dashboard ---------- */
.dash-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.dash-h h1 { font-size: 1.7rem; font-weight: 800; }
.dash-h .wel { color: var(--muted); margin: 0.25em 0 0; font-size: 0.96rem; }
.dash-h .sem { color: var(--muted-2); font-size: 0.82rem; display: flex; gap: 6px; align-items: center; margin-top: 3px; }
.dash-h form { display: flex; gap: 8px; align-items: center; }
.dash-h form input { width: auto; padding: 7px 12px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 18px 20px;
  display: grid;
  gap: 12px;
  background: var(--surface-card);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s;
}
.stat:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow-2); }
button.stat { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
.stat-top { display: flex; justify-content: space-between; align-items: flex-start; }
.stat .sic {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-2);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, filter 0.3s ease;
  box-shadow: 0 2px 8px -2px var(--accent-glow);
}
.stat .sic svg.i { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.stat:hover .sic {
  transform: translateY(-2px) scale(1.16) rotate(-6deg);
  filter: drop-shadow(0 4px 12px var(--accent-glow));
}
.stat:hover .sic svg.i { transform: scale(1.12); }
.stat:active .sic { transform: scale(0.9); }
.stat .k { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.stat .v { font-family: var(--f-display); font-size: 1.85rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .v small { font-size: 0.9rem; color: var(--muted); font-weight: 500; margin-left: 5px; }

.chg {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--ok-soft);
  color: var(--ok);
  white-space: nowrap;
}
.chg.warn { background: var(--warn-soft); color: var(--warn); }
.chg.bad { background: var(--bad-soft); color: var(--bad); }
.chg.neu { background: var(--surface-2); color: var(--muted); }

.mini { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.mini > div {
  border: 1px solid var(--line-2);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--surface-card);
  transition: transform 0.18s;
}
.mini > div:hover { transform: translateY(-2px); border-color: var(--line); }
.mini svg.i { color: var(--accent-2); width: 20px; height: 20px; }
.mini b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; line-height: 1.2; font-weight: 700; }
.mini small { color: var(--muted); font-size: 0.74rem; font-weight: 500; }

.dgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }

/* Activity & Quick actions */
.acts { display: grid; gap: 4px; }
.act {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 8px;
  border-bottom: 1px solid var(--line-2);
  transition: background 0.15s;
}
.act:last-child { border-bottom: 0; }
.act .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.act .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
.act .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
.act .dot.info { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.act b { font-weight: 600; font-size: 0.9rem; }
.act small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 1px; }

.qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.qa button {
  position: relative;
  overflow: hidden;
  display: grid;
  gap: 8px;
  justify-items: start;
  text-align: left;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s, background 0.2s;
}
.qa button:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--hover); }
.qa .qi {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-2);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
}
.qa .qi svg.i { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.qa button:hover .qi {
  transform: translateY(-2px) scale(1.22) rotate(-8deg);
  filter: drop-shadow(0 4px 10px var(--accent-glow));
}
.qa button:hover .qi svg.i { transform: scale(1.12); }
.qa button:active .qi { transform: scale(0.9); }
.qa b { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
.qa small { color: var(--muted); font-size: 0.74rem; }
.qa .cnt { position: absolute; top: 12px; right: 12px; font-size: 0.7rem; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 2px 8px; }

/* Revenue chart */
.rev { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; height: 190px; padding-top: 10px; }
.rev .col { display: grid; grid-template-rows: 1fr auto; gap: 8px; height: 100%; text-align: center; }
.rev .bars2 { display: flex; gap: 6px; align-items: flex-end; justify-content: center; height: 100%; }
.rev .bars2 i {
  width: min(20px, 45%);
  border-radius: 7px 7px 2px 2px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  min-height: 3px;
  position: relative;
  transition: height 0.6s var(--ease);
}
.rev .bars2 i.b { background: rgba(148, 163, 184, 0.35); }
.rev .bars2 i:hover::after {
  content: attr(data-v);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  font-size: 0.72rem;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
  font-style: normal;
  z-index: 20;
  box-shadow: var(--shadow-2);
}
.rev small { color: var(--muted); font-size: 0.74rem; }
.rev .col.cur small { color: var(--accent-2); font-weight: 700; }
.legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.legend i.b { background: rgba(148, 163, 184, 0.35); }

/* Suggestions */
.sugg { display: grid; gap: 10px; }
.sg {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}
.sg:hover { transform: translateY(-2px); border-color: var(--accent); }
.sg .qi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.sg b { font-weight: 600; font-size: 0.9rem; }
.sg small { color: var(--muted); font-size: 0.76rem; }
.prio { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); }
.prio.medium { background: var(--warn-soft); color: var(--warn); }
.ai-chip { display: inline-flex; gap: 5px; align-items: center; font-size: 0.72rem; font-weight: 700; color: var(--accent-2); background: var(--accent-soft); padding: 3px 10px; border-radius: 99px; }

/* Category bars */
.bars { display: grid; gap: 12px; }
.barrow { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 2.5em; gap: 12px; align-items: center; font-size: 0.88rem; }
.track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line-2); }
.track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; }

/* ---------- Interactive Floor Map Plan (Unit Visualizer) ---------- */
.floor-map { display: grid; gap: 16px; margin-top: 14px; }
.floor-row { display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: center; padding: 12px 14px; background: var(--surface-2); border-radius: 14px; border: 1px solid var(--line-2); }
.floor-lbl { font-family: var(--f-display); font-weight: 700; font-size: 0.95rem; color: var(--muted); text-align: center; }
.floor-units { display: flex; flex-wrap: wrap; gap: 10px; }
.unit-tile {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  min-width: 110px;
  transition: all 0.2s var(--spring);
  display: grid;
  gap: 2px;
  text-align: left;
}
.unit-tile:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow-2); border-color: var(--accent); }
.unit-tile.occupied { border-left: 4px solid var(--accent); }
.unit-tile.vacant { border-left: 4px solid var(--ok); }
.unit-tile.maintenance { border-left: 4px solid var(--bad); }
.unit-tile b { font-size: 0.95rem; font-family: var(--f-display); }
.unit-tile span { font-size: 0.72rem; color: var(--muted); }

/* ---------- Maintenance Timeline Stepper ---------- */
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; position: relative; }
.step-item { display: grid; gap: 6px; text-align: center; justify-items: center; position: relative; }
.step-circle { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line); color: var(--muted); font-weight: 700; z-index: 2; transition: all 0.3s; }
.step-item.active .step-circle { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.step-item.done .step-circle { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-lbl { font-size: 0.8rem; font-weight: 600; }
.step-date { font-size: 0.72rem; color: var(--muted); }

/* ---------- Forms & Controls ---------- */
form.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.fld { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fld.wide { grid-column: 1 / -1; }
.fld label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--ink);
  transition: all 0.15s ease;
}
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: var(--surface);
}
textarea { min-height: 96px; resize: vertical; }
input[type=file] { padding: 9px; background: var(--surface); border-style: dashed; cursor: pointer; }

.actions { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.btn {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  background: linear-gradient(135deg, var(--accent), #1d4ed8);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 4px 14px -3px var(--accent-glow);
  transition: all 0.2s var(--spring);
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 18px -4px var(--accent-glow); }
.btn:active { transform: scale(0.96); }
.btn.ghost { background: var(--surface-2); color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { background: var(--hover); border-color: var(--accent); }
.btn.sm { padding: 6px 14px; font-size: 0.84rem; border-radius: 8px; }
.btn.danger { background: linear-gradient(135deg, var(--bad), #b91c1c); box-shadow: 0 4px 14px -3px rgba(239, 68, 68, 0.4); }
.btn.ok { background: linear-gradient(135deg, var(--ok), #047857); box-shadow: 0 4px 14px -3px rgba(16, 185, 129, 0.4); }
.btn.block { width: 100%; }
.btn.danger-t { background: transparent; color: var(--bad); border-color: rgba(239, 68, 68, 0.35); box-shadow: none; }
.btn.danger-t:hover { background: var(--bad-soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

.ibtn {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
}
.ibtn:hover { background: var(--accent-soft); color: var(--accent-2); transform: scale(1.08); }
.ibtn.del:hover { background: var(--bad-soft); color: var(--bad); }
.row-acts { display: flex; gap: 4px; justify-content: flex-end; }

.preview-img { max-width: 220px; max-height: 160px; border-radius: 12px; border: 1px solid var(--line); display: block; margin-top: 8px; box-shadow: var(--shadow-1); }
.form-err { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; color: var(--bad); background: var(--bad-soft); border-radius: var(--r-sm); padding: 10px 14px; font-weight: 600; border: 1px solid rgba(239, 68, 68, 0.3); animation: shake 0.4s ease; }
.form-err:empty { display: none; }
.err { color: var(--bad); }

/* ---------- Tables ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface-card); box-shadow: var(--shadow-1); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.9rem; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 250px; }
th { font-weight: 700; font-size: 0.76rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; background: var(--surface-2); position: sticky; top: 0; }
tbody tr { transition: background 0.15s; }
tbody tr:hover { background: var(--hover); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.empty { padding: 42px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty svg.i { width: 34px; height: 34px; color: var(--line); }

/* Pills & Badges */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 0.76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(16, 185, 129, 0.25); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(245, 158, 11, 0.25); }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(239, 68, 68, 0.25); }
.pill.info { background: var(--info-soft); color: var(--info); border-color: rgba(14, 165, 233, 0.25); }

/* Flash message */
.flash { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: var(--r); font-weight: 600; background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(16, 185, 129, 0.3); animation: pop 0.4s var(--spring); }
.flash.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(239, 68, 68, 0.3); }

/* Overlays & Modals */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
.overlay.out { animation: fadeOut 0.2s ease forwards; }
.modal {
  width: min(650px, 100%);
  max-height: min(88vh, 860px);
  overflow-y: auto;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  animation: modalIn 0.35s var(--spring);
  border: 1px solid var(--line);
}
.modal.sm { width: min(420px, 100%); }
.modal-h { display: flex; align-items: center; gap: 14px; padding: 20px 24px 0; }
.modal-h h2 { font-size: 1.25rem; margin-right: auto; }
.modal-b { padding: 18px 24px 24px; }
.modal-acts { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.modal img.full { display: block; max-width: 100%; border-radius: 12px; background: #fff; box-shadow: var(--shadow-2); }
.danger-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bad-soft); color: var(--bad); flex: none; }
.danger-ic svg.i { width: 24px; height: 24px; }

/* Toasts */
#toasts {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  right: max(20px, env(safe-area-inset-right, 0px));
  z-index: 70;
  display: grid;
  gap: 10px;
  width: min(380px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: start;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 14px 16px;
  border-radius: var(--r);
  box-shadow: var(--shadow-3);
  animation: toastIn 0.35s var(--spring);
  font-size: 0.9rem;
}
.toast.out { animation: toastOut 0.22s ease forwards; }
.toast .ti { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.toast.bad .ti { background: var(--bad-soft); color: var(--bad); }
.toast.info .ti { background: var(--info-soft); color: var(--info); }
.toast b { display: block; font-family: var(--f-display); font-size: 0.94rem; margin-bottom: 2px; }
.toast .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 6px; }
.toast .x:hover { background: var(--hover); }
.toast .tb { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ok); transform-origin: left; animation: bar 3.6s linear forwards; }
.toast.bad .tb { background: var(--bad); }
.toast.info .tb { background: var(--info); }

/* Notifications Drawer */
.notif {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 55;
  width: min(400px, calc(100% - 32px));
  max-height: min(72vh, 580px);
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-3);
  animation: modalIn 0.3s var(--spring);
  overflow: hidden;
}
.notif.out { animation: modalOut 0.18s ease forwards; }
.notif-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.notif-h h3 { font-size: 1.05rem; }
.notif-l { overflow-y: auto; }
.nitem {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: start;
  width: 100%;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--line-2);
  background: none;
  padding: 14px 18px;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.15s;
}
.nitem:hover { background: var(--hover); }
.nitem .ti { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.nitem.bad .ti { background: var(--bad-soft); color: var(--bad); }
.nitem.warn .ti { background: var(--warn-soft); color: var(--warn); }
.nitem small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.nitem .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.nitem.read { opacity: 0.65; }
.nitem.read .dot { visibility: hidden; }

/* ---------- Pop Icon System & Keyframes ---------- */
@keyframes iconPopIn {
  0% { transform: scale(0.6) rotate(-10deg); opacity: 0; }
  70% { transform: scale(1.22) rotate(4deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes floatSlow {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
}
@keyframes pulseGlow {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
  50% { transform: scale(1.1); filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
}
.pop-ic {
  display: inline-grid;
  place-items: center;
  position: relative;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease;
}
.pop-ic svg.i {
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.pop-ic:hover svg.i,
button:hover .pop-ic svg.i {
  transform: scale(1.24) rotate(-6deg);
}

/* ---------- Login Screen ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.login-art {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.78) 50%, rgba(15, 23, 42, 0.96) 100%),
    url("assets/condo-hero.jpg") center/cover no-repeat,
    linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  padding: 48px clamp(24px, 5vw, 64px);
  display: grid;
  align-content: space-between;
  gap: 28px;
  border-right: 1px solid var(--line-2);
}
.login-art::before {
  content: "";
  position: absolute;
  top: -120px;
  right: -120px;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, transparent 70%);
  pointer-events: none;
  filter: blur(40px);
}
.login-art h1 { font-size: clamp(2rem, 3.5vw, 2.7rem); font-weight: 800; max-width: 18ch; line-height: 1.2; letter-spacing: -0.02em; }
.login-art p { color: #94a3b8; max-width: 46ch; font-size: 1.05rem; line-height: 1.5; }
.login-art .feat { display: flex; flex-wrap: wrap; gap: 11px; margin-block: 4px; }
.login-art .feat span {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  padding: 7px 15px;
  border-radius: 99px;
  font-size: 0.86rem;
  font-weight: 500;
  color: #f1f5f9;
  box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.3);
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: default;
}
.login-art .feat span:hover {
  transform: translateY(-3px) scale(1.05);
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(96, 165, 250, 0.5);
  box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.45);
}
.login-art .feat span svg.i {
  color: #60a5fa;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.login-art .feat span:hover svg.i {
  transform: scale(1.28) rotate(8deg);
  color: #93c5fd;
}

.login-showcase {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-top: 4px;
}
.login-showcase-item {
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.25s var(--spring), border-color 0.25s, background 0.25s;
}
.login-showcase-item:hover {
  transform: translateY(-3px);
  border-color: rgba(96, 165, 250, 0.5);
  background: rgba(15, 23, 42, 0.85);
}
.login-showcase-item .sic {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
  border: 1px solid rgba(96, 165, 250, 0.3);
  flex: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.login-showcase-item:hover .sic {
  transform: scale(1.2) rotate(-8deg);
  color: #93c5fd;
  filter: drop-shadow(0 4px 10px rgba(96, 165, 250, 0.5));
}
.login-showcase-item b {
  display: block;
  font-family: var(--f-display);
  font-size: 1.15rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}
.login-showcase-item small {
  color: #94a3b8;
  font-size: 0.74rem;
}

.login-side { display: grid; place-items: center; padding-block: 40px; position: relative; }
.login-tools { position: absolute; top: max(20px, env(safe-area-inset-top, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; z-index: 2; }
.login-card { width: min(100%, 430px); display: grid; gap: 18px; animation: modalIn 0.4s var(--spring); }
.demo { display: grid; gap: 8px; }
.demo button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  text-align: left;
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  transition: all 0.22s var(--spring);
}
.demo button:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  background: var(--hover);
  box-shadow: 0 4px 14px -3px var(--accent-glow);
}
.demo button .role-avatar {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 0.82rem;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent-2);
  flex: none;
  transition: transform 0.25s var(--spring);
}
.demo button:hover .role-avatar {
  transform: scale(1.18) rotate(6deg);
}

/* Resident Hero Card */
.res-hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background:
    linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.82) 55%, rgba(30, 41, 59, 0.94) 100%),
    url("assets/condo-hero.jpg") center/cover no-repeat,
    linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  padding: 26px 30px;
  display: grid;
  gap: 16px;
  box-shadow: var(--shadow-2);
}
.res-hero::before {
  content: "";
  position: absolute;
  top: -80px;
  right: -80px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, transparent 70%);
  pointer-events: none;
  filter: blur(30px);
}
.res-hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.res-hero h1 {
  font-size: clamp(1.4rem, 2.5vw, 1.85rem);
  font-weight: 800;
  color: #fff;
  margin: 0;
  letter-spacing: -0.02em;
}
.res-hero .unit-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-radius: 99px;
  background: rgba(59, 130, 246, 0.22);
  border: 1px solid rgba(96, 165, 250, 0.35);
  color: #93c5fd;
  font-weight: 700;
  font-size: 0.86rem;
  font-family: var(--f-mono);
}
.res-hero-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.res-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 0.84rem;
  color: #e2e8f0;
  transition: transform 0.25s var(--spring), border-color 0.25s;
}
.res-chip:hover {
  transform: translateY(-2px);
  border-color: rgba(96, 165, 250, 0.5);
}
.res-chip svg.i {
  color: #60a5fa;
  transition: transform 0.25s var(--spring);
}
.res-chip:hover svg.i {
  transform: scale(1.22) rotate(-8deg);
  color: #93c5fd;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .shell { display: block; padding: 0; }
  .side-resizer { display: none !important; }
  main { width: 100%; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .menu-btn { display: grid; }
  .side {
    position: fixed;
    z-index: 45;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(300px, 86vw) !important;
    min-width: 0 !important;
    max-width: none !important;
    height: 100vh;
    max-height: none;
    border-radius: 0;
    border-right: 1px solid var(--line-2);
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    transform: translateX(-104%);
    transition: transform 0.35s var(--ease);
    box-shadow: var(--shadow-3);
  }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .who-t, .nav-search { display: none; }
  .login { grid-template-columns: 1fr; }
  .login-art { padding-block: 36px 28px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dgrid { grid-template-columns: 1fr; }
  .mini { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr; }
  .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qa { grid-template-columns: 1fr; }
}

/* Animations */
@keyframes pop { 0% { transform: scale(0.7); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes modalIn { from { transform: translateY(16px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes modalOut { to { transform: translateY(10px) scale(0.96); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes toastIn { from { transform: translateX(36px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateX(36px) scale(0.95); opacity: 0; } }
@keyframes bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
@keyframes flashRow { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
tr.is-new td { animation: flashRow 1.8s ease-out; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.25s; }

</style>

const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n, l) => String(n).padStart(l, "0");

function nowLocal() {
  const d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1, 2) + "-" + pad(d.getDate(), 2) + "T" + pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2);
}
const today = () => nowLocal().slice(0, 10);
const thisMonth = () => nowLocal().slice(0, 7);

function prevMonth() {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1, 2);
}

function shiftMonth(m, d) {
  if (!m) return thisMonth();
  const x = new Date(m + "-01T00:00");
  x.setMonth(x.getMonth() + d);
  return x.getFullYear() + "-" + pad(x.getMonth() + 1, 2);
}

function fmtDate(s) {
  if (!s) return "-";
  const d = new Date(s.length <= 10 ? s + "T00:00" : s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "numeric" });
}

function fmtDT(s) {
  if (!s) return "-";
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString(LOC(), { day: "numeric", month: "short", year: "2-digit" }) + " " + pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2);
}

function monthLabel(m) {
  if (!m) return "-";
  const d = new Date(m + "-01T00:00");
  return d.toLocaleDateString(LOC(), { month: "short", year: "numeric" });
}

const money = n => Number(n || 0).toLocaleString(LOC(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function ago(s) {
  const d = new Date(s);
  if (isNaN(d)) return "";
  const sec = (Date.now() - d) / 1000;
  if (sec < 0) return fmtDT(s);
  if (sec < 60) return T("เมื่อสักครู่");
  if (sec < 3600) return Math.floor(sec / 60) + " " + T("นาทีที่แล้ว");
  if (sec < 86400) return Math.floor(sec / 3600) + " " + T("ชั่วโมงที่แล้ว");
  if (sec < 86400 * 7) return Math.floor(sec / 86400) + " " + T("วันที่แล้ว");
  return fmtDate(s);
}

function invoiceId(round) {
  if (!round) round = thisMonth();
  const y = String((parseInt(round.slice(0, 4), 10) + 543) % 100).padStart(2, "0");
  const pre = "INV-" + y + round.slice(5, 7) + "-";
  let m = 0;
  if (db && db.invoices) {
    db.invoices.forEach(i => {
      if (i.Invoice_ID && i.Invoice_ID.indexOf(pre) === 0) {
        const n = parseInt(i.Invoice_ID.slice(pre.length), 10);
        if (n > m) m = n;
      }
    });
  }
  return pre + pad(m + 1, 3);
}

function nextId(prefix, arr, key, len) {
  let m = 0;
  if (arr) {
    arr.forEach(r => {
      const n = parseInt(String(r[key] || "").replace(/\D/g, ""), 10);
      if (n > m) m = n;
    });
  }
  return prefix + pad(m + 1, len || 3);
}

/* ---------- State Management ---------- */
let db, me = null, view = null, sel = {}, fails = 0, flashMsg = null;
let warned = false;

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      db = JSON.parse(s);
      return;
    }
  } catch (e) {}
  db = seed();
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (e) {
    if (!warned) {
      warned = true;
      toast(T("เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้ การแก้ไขจะอยู่จนกว่าจะปิดหน้านี้"), "bad");
    }
  }
}

function log(action, table, ref) {
  if (!db || !db.logs) return;
  db.logs.push({
    Log_ID: nextId("LOG", db.logs, "Log_ID"),
    User_ID: me ? me.User_ID : "-",
    action,
    table,
    ref,
    at: nowLocal()
  });
}

const userById = id => db.users.find(u => u.User_ID === id);
const unitById = id => db.units.find(u => u.Unit_ID === id);
const facById = id => db.facilities.find(f => f.Facility_ID === id);
const invById = id => db.invoices.find(i => i.Invoice_ID === id);
const fullName = u => u ? u.fname + " " + u.lname : "-";
const residents = () => db.users.filter(u => u.role === "resident");
const residentOf = unit => db.users.find(u => u.role === "resident" && u.Unit_ID === unit);

let LANG = "th";
try {
  LANG = localStorage.getItem(KEY + "-lang") || "th";
} catch (e) {}
const LOC = () => LANG === "en" ? "en-GB" : "th-TH";
const EN_KEYS = Object.keys(EN).sort((a, b) => b.length - a.length);
const THAI = /[\u0E00-\u0E7F]/;

function trText(t) {
  if (!t || !THAI.test(t)) return t;
  let s = t;
  for (const k of EN_KEYS) {
    if (s.indexOf(k) < 0) continue;
    const v = EN[k];
    s = s.split(k).join(v ? "\u0001" + v + "\u0002" : "");
  }
  s = s.replace(/\u0002\u0001/g, " ")
       .replace(/([^\s(/·:"“\u0001])\u0001/g, "$1 ")
       .replace(/\u0002([^\s),.:;!?/·"”%\u0002])/g, " $1")
       .replace(/[\u0001\u0002]/g, "")
       .replace(/ {2,}/g, " ");
  return s;
}

const TR_ATTRS = ["placeholder", "aria-label", "title", "alt", "data-v"];
function trNode(root) {
  if (LANG !== "en" || !root) return;
  if (root.nodeType === 3) {
    if (THAI.test(root.data) && !(root.parentElement && root.parentElement.closest('[translate="no"],script,style'))) {
      root.data = trText(root.data);
    }
    return;
  }
  if (root.nodeType !== 1 || (root.closest && root.closest('[translate="no"]'))) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode(n) {
      if (n.nodeType === 1) return (n.getAttribute("translate") === "no" || n.tagName === "SCRIPT" || n.tagName === "STYLE") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP;
      return THAI.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
    }
  });
  const list = [];
  let n;
  while ((n = w.nextNode())) list.push(n);
  list.forEach(x => { x.data = trText(x.data); });
  const els = [root, ...root.querySelectorAll("[" + TR_ATTRS.join("],[") + "]")];
  els.forEach(el => {
    if (el.closest && el.closest('[translate="no"]')) return;
    TR_ATTRS.forEach(a => {
      const v = el.getAttribute && el.getAttribute(a);
      if (v && THAI.test(v)) el.setAttribute(a, trText(v));
    });
  });
}

const trObs = new MutationObserver(ms => {
  if (LANG !== "en") return;
  ms.forEach(m => m.addedNodes.forEach(trNode));
});
trObs.observe(document.body, { childList: true, subtree: true });

/* ---------- Toast System ---------- */
function toast(msg, kind) {
  kind = kind || "ok";
  flashMsg = { msg, kind };
  const box = $("#toasts");
  if (!box) return;
  while (box.children.length >= 4) box.firstChild.remove();
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.setAttribute("role", kind === "bad" ? "alert" : "status");
  t.innerHTML = '<span class="ti">' + ico(kind === "bad" ? "alert" : kind === "info" ? "bell" : "check") + '</span><div class="tx"><b>' + (kind === "bad" ? T("ทำรายการไม่สำเร็จ") : kind === "info" ? T("การแจ้งเตือน") : T("สำเร็จ")) + '</b><span>' + esc(msg) + '</span></div><button class="x" aria-label="' + T("ปิดหน้าต่าง") + '">' + ico("x") + '</button><span class="tb"></span>';
  const kill = () => {
    if (!t.isConnected) return;
    t.classList.add("out");
    setTimeout(() => t.remove(), 220);
  };
  const btnX = t.querySelector(".x");
  if (btnX) btnX.addEventListener("click", kill);
  let timer = setTimeout(kill, 3600);
  t.addEventListener("mouseenter", () => {
    clearTimeout(timer);
    const tb = t.querySelector(".tb");
    if (tb) tb.style.animationPlayState = "paused";
  });
  t.addEventListener("mouseleave", () => {
    timer = setTimeout(kill, 1600);
    const tb = t.querySelector(".tb");
    if (tb) tb.style.animationPlayState = "running";
  });
  box.appendChild(t);
}

function formErr(form, msg) {
  let el = form.querySelector(".form-err");
  if (!el) {
    el = document.createElement("div");
    el.className = "form-err";
    form.insertBefore(el, form.querySelector(".actions"));
  }
  el.setAttribute("role", "alert");
  el.innerHTML = ico("alert") + "<span>" + esc(msg) + "</span>";
  toast(msg, "bad");
  flashMsg = null;
}

let modalEl = null, modalOk = null;
function openModal(o) {
  closeModal(true);
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="modal' + (o.small ? " sm" : "") + '" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="modal-h">' +
    (o.danger ? '<span class="danger-ic">' + ico("trash") + '</span>' : o.icon ? '<span class="head-ic" style="width:40px;height:40px;border-radius:10px">' + ico(o.icon) + '</span>' : '') +
    '<h2 id="m-title">' + esc(o.title) + '</h2><button class="icon-btn" data-close aria-label="' + T("ปิดหน้าต่าง") + '">' + ico("x") + '</button></div><div class="modal-b">' + o.body + '</div></div>';
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(); });
  ov.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); closeModal(); }));
  $("#layer").appendChild(ov);
  modalEl = ov;
  modalOk = o.onOk || null;
  const f = ov.querySelector("input:not([type=hidden]):not([readonly]), select, textarea, .modal-acts .btn:last-child");
  if (f) setTimeout(() => f.focus(), 60);
  if (o.onOk) {
    ov.querySelector("[data-ok]").addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      const fn = modalOk;
      closeModal();
      fn && fn();
    });
  }
}

function closeModal(now) {
  if (!modalEl) return;
  const m = modalEl;
  modalEl = null;
  modalOk = null;
  if (now) { m.remove(); return; }
  m.classList.add("out");
  setTimeout(() => m.remove(), 200);
}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          const k = max / Math.max(w, h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = () => res(r.result);
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function qrPattern(seedStr) {
  const n = 25, c = document.createElement("canvas");
  c.width = n; c.height = n;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, n, n);
  x.fillStyle = "#0f172a";
  let h = 0;
  for (const ch of seedStr) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (rnd() > 0.52) x.fillRect(i, j, 1, 1);
    }
  }
  const finder = (a, b) => {
    x.fillStyle = "#0f172a"; x.fillRect(a, b, 7, 7);
    x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, 5, 5);
    x.fillStyle = "#0f172a"; x.fillRect(a + 2, b + 2, 3, 3);
  };
  x.fillStyle = "#fff";
  x.fillRect(0, 0, 8, 8); x.fillRect(n - 8, 0, 8, 8); x.fillRect(0, n - 8, 8, 8);
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  return c.toDataURL();
}

function getBadgeCount(code) {
  if (!db) return 0;
  if (code === "1.3") return db.payments.filter(p => p.verify === "รอตรวจสอบ").length;
  if (code === "9.4" || code === "8.2") return db.tickets.filter(t => t.status === "รับเรื่อง").length;

function collected(m) {
  return db.payments.filter(p => p.verify === "อนุมัติ" && p.at.slice(0, 7) === m).reduce((s, p) => s + Number((invById(p.Invoice_ID) || {}).total || 0), 0);
}
function billed(m) {
  return db.invoices.filter(i => i.round === m).reduce((s, i) => s + Number(i.total), 0);
}

function chg(cur, prev, unit, invert) {
  if (prev === 0 && cur === 0) return '<span class="chg neu">' + T("ไม่เปลี่ยนแปลง") + '</span>';
  if (prev === 0) return '<span class="chg' + (invert ? " warn" : "") + '">' + ico("up") + T("ใหม่") + " +" + cur.toLocaleString(LOC()) + '</span>';
  const p = Math.round((cur - prev) / prev * 100);
  const up = p >= 0;
  const good = invert ? !up : up;
  return '<span class="chg' + (good ? "" : " bad") + '">' + ico(up ? "up" : "down") + (up ? "+" : "") + p + "%</span>";
}

function actTone(a) {
  if (/ลบ|ยกเลิก|ไม่อนุมัติ/.test(a)) return "bad";
  if (/แจ้ง|อัปเดต|จอง|รับพัสดุ|บันทึกเวลา/.test(a)) return "warn";
  if (/เข้าสู่ระบบ|ออกจากระบบ/.test(a)) return "info";
  return "ok";
}

function suggestions(m) {
  const s = [];
  const add = (prio, icon, title, sub, goTo) => s.push({ prio, icon, title, sub, go: goTo });
  const slip = db.payments.filter(p => p.verify === "รอตรวจสอบ");
  if (slip.length) add("high", "badge", T("ตรวจสอบสลิป") + " " + slip.length + " " + T("รายการ"), T("ผู้อยู่อาศัยส่งหลักฐานการโอนแล้ว รออนุมัติ"), "1.3");
  const nt = db.tickets.filter(t => t.status === "รับเรื่อง");
  if (nt.length) add("high", "wrench", T("งานซ่อมใหม่") + " " + nt.length + " " + T("งานยังไม่เริ่ม"), nt.map(t => t.Ticket_ID + " " + t.category).join(", "), "9.4");
  const pm = prevMonth();
  const nobill = db.units.filter(u => residentOf(u.Unit_ID) && !db.invoices.some(i => i.Unit_ID === u.Unit_ID && i.round === pm));
  if (nobill.length) add("medium", "rtext", T("ยังไม่ออกใบแจ้งหนี้รอบ") + " " + monthLabel(pm) + " " + nobill.length + " " + T("ห้อง"), nobill.map(u => u.Unit_ID).join(", "), "1.1");
  const overdue = db.invoices.filter(i => i.status === "ยังไม่ชำระ" && i.round < thisMonth());
  if (overdue.length) add("medium", "receipt", T("ใบแจ้งหนี้เลยรอบ") + " " + overdue.length + " " + T("ใบ"), overdue.map(i => i.Invoice_ID).join(", "), "1.1");
  const lim = new Date();
  lim.setDate(lim.getDate() + 60);
  const L = lim.toISOString().slice(0, 10);
  const ending = db.contracts.filter(c => c.status === "มีผล" && c.end <= L && c.end >= today());
  if (ending.length) add("medium", "filepen", T("สัญญาใกล้หมดอายุใน 60 วัน") + " " + ending.length + " " + T("ฉบับ"), ending.map(c => c.Unit_ID + " " + T("สิ้นสุด") + " " + fmtDate(c.end)).join(", "), "5.2");
  const old = db.parcels.filter(p => p.status === "รอรับ" && (Date.now() - new Date(p.inAt)) > 2 * 86400000);
  if (old.length) add("medium", "box", T("พัสดุค้างเกิน 2 วัน") + " " + old.length + " " + T("ชิ้น"), old.map(p => p.Parcel_ID + " " + T("ห้อง") + " " + p.Unit_ID).join(", "), "6.2");
  const vin = db.visitors.filter(v => !v.outAt);
  if (vin.length) add("medium", "door", T("ผู้มาติดต่อยังไม่บันทึกเวลาออก") + " " + vin.length + " " + T("คน"), vin.map(v => v.name).join(", "), "10.2");
  return s;
}

function calcInvoice(unitId, f) {
  const u = unitById(unitId);
  if (!u) return null;
  const latest = t => db.meters.filter(m => m.Unit_ID === unitId && m.type === t).sort((a, b) => b.date.localeCompare(a.date))[0];
  const w = latest("น้ำ"), e = latest("ไฟฟ้า");
  const wu = w ? Math.max(0, w.curr - w.prev) : 0;
  const eu = e ? Math.max(0, e.curr - e.prev) : 0;
  const common = f.common !== "" && f.common != null ? Number(f.common) : u.size * 35;
  const water = Math.round(wu * Number(f.wrate || 18));
  const elec = Math.round(eu * Number(f.erate || 7));
  const other = Number(f.other || 0);
  return { u, w, e, wu, eu, common, water, elec, other, total: common + water + elec + other, res: residentOf(unitId) };
}

function renderFloorMap(bldFilter) {
  const bld = bldFilter || "A";
  const unitsInBld = db.units.filter(u => u.Building_ID === bld);
  const floors = [...new Set(unitsInBld.map(u => u.floor))].sort((a, b) => b - a);

  if (!floors.length) return '<div class="empty">' + T("ไม่พบห้อง") + '</div>';

  return '<div class="floor-map">' + floors.map(fl => {
    const flUnits = unitsInBld.filter(u => u.floor === fl).sort((a, b) => a.Unit_ID.localeCompare(b.Unit_ID));
    return '<div class="floor-row"><div class="floor-lbl">' + T("ชั้น") + ' ' + fl + '</div><div class="floor-units">' +
      flUnits.map(u => {
        const cls = u.status === "มีผู้เช่า" ? "occupied" : u.status === "ว่าง" ? "vacant" : "maintenance";
        const res = residentOf(u.Unit_ID);
        return '<div class="unit-tile ' + cls + '" data-act="editUnit" data-id="' + esc(u.Unit_ID) + '" title="' + esc(u.Unit_ID + ' · ' + u.status) + '"><b>' + esc(u.Unit_ID) + '</b><span>' + esc(u.size) + ' ' + T("ตร.ม.") + ' · ' + pill(u.status) + '</span>' + (res ? '<span class="muted" style="margin-top:2px">' + esc(fullName(res)) + '</span>' : '') + '</div>';
      }).join("") + '</div></div>';
  }).join("") + '</div>';
}

function skyline() {
  const B = [[0, 70, 44, 90], [50, 30, 60, 130], [116, 56, 40, 104], [162, 10, 72, 150], [240, 48, 36, 112], [282, 82, 38, 78]];
  let w = "";
  let k = 0;
  B.forEach(b => {
    for (let y = b[1] + 10; y < b[1] + b[3] - 12; y += 16) {
      for (let x = b[0] + 7; x < b[0] + b[2] - 8; x += 12) {
        k++;
        if ((k * 7) % 5 < 2) {
          w += '<rect class="win" x="' + x + '" y="' + y + '" width="5" height="7" fill="currentColor" opacity="0.3"/>';
        }
      }
    }
  });
  return '<svg class="sky" viewBox="0 0 320 160" aria-hidden="true" style="width:100%;max-width:520px;height:auto;fill:currentColor;opacity:0.25"><g class="blk">' +
    B.map(b => '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" rx="2"/>').join("") +
    '</g>' + w + '</svg>';
}

function slots(f) {
  const out = [];
  let h = parseInt(f.open, 10);
  const e = parseInt(f.close, 10);
  for (; h < e; h++) out.push(pad(h, 2) + ":00-" + pad(h + 1, 2) + ":00");
  return out;
}

function repairStepper(status) {
  const s1 = status === "รับเรื่อง" || status === "กำลังดำเนินการ" || status === "เสร็จสิ้น";
  const s2 = status === "กำลังดำเนินการ" || status === "เสร็จสิ้น";
  const s3 = status === "เสร็จสิ้น";
  return '<div class="stepper">' +
    '<div class="step-item ' + (s1 ? (s2 ? "done" : "active") : "") + '"><div class="step-circle">' + (s2 ? ico("check") : "1") + '</div><div class="step-lbl">' + T("รับเรื่อง") + '</div></div>' +
    '<div class="step-item ' + (s2 ? (s3 ? "done" : "active") : "") + '"><div class="step-circle">' + (s3 ? ico("check") : "2") + '</div><div class="step-lbl">' + T("กำลังดำเนินการ") + '</div></div>' +
    '<div class="step-item ' + (s3 ? "done" : "") + '"><div class="step-circle">' + (s3 ? ico("check") : "3") + '</div><div class="step-lbl">' + T("เสร็จสิ้น") + '</div></div>' +
    '</div>';
}

/* Create Invoice (1.1) */
H["1.1"] = (fd, form, live) => {
  const f = {
    unit: fd.get("unit"),
    round: fd.get("round"),
    common: fd.get("common"),
    wrate: fd.get("wrate"),
    erate: fd.get("erate"),
    other: fd.get("other")
  };
  sel.inv = f;
  if (live) return;
  const c = calcInvoice(f.unit, f);
  if (!c || !c.res) {
    toast(T("ยังไม่มีห้องที่มีผู้อยู่อาศัย"), "bad");
    return;
  }
  if (db.invoices.find(i => i.Unit_ID === f.unit && i.round === f.round)) {
    toast(T("ห้องนี้มีใบแจ้งหนี้รอบนี้แล้ว"), "bad");
    return;
  }
  const id = invoiceId(f.round);
  db.invoices.push({
    Invoice_ID: id,
    Unit_ID: f.unit,
    User_ID: c.res.User_ID,
    round: f.round,
    common: c.common,
    water: c.water,
    elec: c.elec,
    other: c.other,
    total: c.total,
    status: "ยังไม่ชำระ"
  });
  log("สร้าง", "ใบแจ้งหนี้", id);
  sel.inv = null;
  sel.hl = id;
  toast(T("บันทึกใบแจ้งหนี้") + " " + id + " " + T("สำเร็จ"));
};

/* Book Facility (2.1) */
H["2.1"] = (fd, form, live) => {
  const f = { fac: fd.get("fac"), date: fd.get("date"), slot: fd.get("slot") };
  sel.book = f;
  if (live) return;

  const fac = facById(f.fac);
  if (!fac) return;
  if (!f.slot) {
    toast(T("กรุณาเลือกช่วงเวลา"), "bad");
    return;
  }
  const n = db.bookings.filter(b => b.Facility_ID === f.fac && b.date === f.date && b.slot === f.slot && b.status !== "ยกเลิก").length;
  if (n >= fac.capacity) {
    toast(T("ช่วงเวลานี้เต็มแล้ว กรุณาเลือกช่วงอื่น"), "bad");
    return;

    return;

    Booking_ID: id,
    Facility_ID: f.fac,
    Unit_ID: me.Unit_ID || "-",

    date: f.date,
    slot: f.slot,
    status: "ยืนยันแล้ว"
  });

  sel.hl = id;
  toast(T("จองส่วนกลาง") + " " + fac.name + " " + T("สำเร็จ") + " (" + id + ")");
};

/* ---------- Actions Dispatcher ---------- */
const A = {
  logout() {
    closeDD(true);
    if (me) log("ออกจากระบบ", "บัญชีผู้ใช้", me.User_ID);
    save();
    me = null;
    sel = {};
    lastUnread = -1;
    closeNotif(true);
    closeModal(true);
    try { sessionStorage.removeItem(KEY + "-me"); } catch (e) {}
    render();
    return "noop";
  },
  fill(id) {
    const u = userById(id);
    if (!u) return "noop";
    const fu = $("#f-username");
    const fp = $("#f-password");
    if (fu) fu.value = u.username;
    if (fp) fp.value = u.password;
    const fe = document.querySelector(".form-err");
    if (fe) fe.innerHTML = "";
    return "noop";
  },
  reset() {
    db = seed();
    save();
    sel = {};
    lastUnread = -1;
    if (me) { me = userById(me.User_ID) || null; }
    if (me && !V[view]) view = me.role === "admin" ? "8.1" : "home";
    render();
    toast(T("รีเซ็ตข้อมูลตัวอย่างแล้ว"), "info");
    return "noop";
  },
  navToggle() {
    document.body.classList.toggle("nav-open");
    return "noop";
  },
  navClose() {
    document.body.classList.remove("nav-open");
    return "noop";
  },
  bell() {
    closeDD(true);
    toggleNotif();
    return "noop";
  },
  avatar() {
    closeNotif(true);
    toggleDD();
    return "noop";
  },
  sideMini() {
    const v = !uiPref().mini;
    setPref("mini", v);
    document.body.classList.toggle("side-mini", v);
    const b = document.querySelector(".mini-btn");
    if (b) {
      b.innerHTML = ico(v ? "popen" : "pclose");
      b.setAttribute("aria-label", v ? T("ขยายเมนู") : T("พับเมนู"));
      b.title = v ? T("ขยายเมนู") : T("พับเมนู");
      trNode(b);
    }
    if (!v) {
      const savedW = uiPref().sideW || 290;
      setSideW(savedW);
    }
    return "noop";
  },
  grpToggle(id) {
    const sh = new Set(uiPref().shut || []);
    const g = document.querySelector('.grp[data-grp="' + CSS.escape(id) + '"]');
    const close = !sh.has(id);
    if (close) sh.add(id); else sh.delete(id);
    setPref("shut", [...sh]);
    if (g) {
      g.classList.toggle("shut", close);
      const btn = g.querySelector(".grp-h");

/* ---------- Shell & Rendering Architecture ---------- */
function uiPref() {
  try { return JSON.parse(localStorage.getItem(KEY + "-ui")) || {}; } catch (e) { return {}; }
}
function setPref(k, v) {
  const p = uiPref();
  p[k] = v;
  try { localStorage.setItem(KEY + "-ui", JSON.stringify(p)); } catch (e) {}
}

function computeNotifs() {
  const n = [];
  const add = (key, text, sub, goTo, kind, icon, rawT, rawS) => n.push({ key, text, sub, go: goTo, kind, icon, rawT, rawS });
  if (!me) return n;
  if (me.role === "admin") {
    db.payments.filter(p => p.verify === "รอตรวจสอบ").forEach(p => add("pay:" + p.Payment_ID, T("มีหลักฐานการชำระรอตรวจสอบ") + " " + p.Invoice_ID, fmtDT(p.at), "1.3", "warn", "card"));
    db.tickets.filter(t => t.status === "รับเรื่อง").forEach(t => add("tk:" + t.Ticket_ID, T("งานซ่อมใหม่") + " " + t.Ticket_ID + " · " + t.category, t.place, "9.4", "bad", "wrench", false, true));
    db.visitors.filter(v => !v.outAt).forEach(v => add("vs:" + v.Visitor_ID, T("ผู้มาติดต่อยังอยู่ในอาคาร") + ": " + v.name, T("ห้อง") + " " + v.Unit_ID + " · " + T("วันเวลาเข้า") + " " + fmtDT(v.inAt), "10.2", "info", "door"));
    db.parcels.filter(p => p.status === "รอรับ").forEach(p => add("pc:" + p.Parcel_ID, T("พัสดุ") + " " + p.Parcel_ID + " " + T("ยังไม่มีผู้มารับ"), T("ห้อง") + " " + p.Unit_ID, "6.2", "info", "box"));
  } else {
    db.invoices.filter(i => i.Unit_ID === me.Unit_ID && i.status === "ยังไม่ชำระ").forEach(i => add("inv:" + i.Invoice_ID, T("ใบแจ้งหนี้") + " " + monthLabel(i.round) + " " + T("ยอดรวม") + " " + money(i.total) + " " + T("บาท"), i.Invoice_ID + " · " + T("ยังไม่ชำระ"), "u1.1", "bad", "receipt"));
    db.payments.filter(p => p.verify !== "รอตรวจสอบ" && db.invoices.some(i => i.Invoice_ID === p.Invoice_ID && i.Unit_ID === me.Unit_ID)).slice(-2).forEach(p => add("pv:" + p.Payment_ID + p.verify, T("ผลตรวจสอบการชำระ") + " " + p.Invoice_ID + ": " + p.verify, fmtDT(p.at), "1.2", p.verify === "อนุมัติ" ? "info" : "bad", "card"));
    db.parcels.filter(p => p.Unit_ID === me.Unit_ID && p.status === "รอรับ").forEach(p => add("pc:" + p.Parcel_ID, T("มีพัสดุ") + " " + p.carrier + " " + T("รอรับ"), p.Parcel_ID + " · " + fmtDT(p.inAt), "6.3", "warn", "box"));
    db.tickets.filter(t => t.User_ID === me.User_ID && t.status !== "ยกเลิก").forEach(t => add("tk:" + t.Ticket_ID + t.status, T("งานซ่อม") + " " + t.Ticket_ID + ": " + t.status, T(t.category) + " · " + t.place, "9.1", t.status === "เสร็จสิ้น" ? "info" : "warn", "wrench", false, true));
    annSorted().slice(0, 3).forEach(a => add("an:" + a.AN_ID, T("ประกาศ") + ": " + a.title, fmtDate(a.date) + " · " + a.priority, "u7", a.priority === "ด่วน" ? "bad" : "info", "mega", true));
  }
  const seen = (db.seen && db.seen[me.User_ID]) || [];
  n.forEach(x => { x.read = seen.includes(x.key); });
  return n;
}

let lastUnread = -1, notifEl = null, ddEl = null;

function updateBell() {
  const b = $("#badge");
  if (!b || !me) return;
  const u = computeNotifs().filter(x => !x.read).length;
  if (u !== lastUnread) {
    b.innerHTML = u ? '<span class="badge">' + (u > 9 ? "9+" : u) + '</span>' : "";
    lastUnread = u;
  }
  if (notifEl) fillNotif();
}

function markSeen(keys) {
  db.seen = db.seen || {};
  const s = new Set(db.seen[me.User_ID] || []);
  keys.forEach(k => s.add(k));
  db.seen[me.User_ID] = [...s];
  save();
}

function fillNotif() {
  if (!notifEl) return;
  const list = computeNotifs();
  const unread = list.filter(x => !x.read).length;
  notifEl.innerHTML = '<div class="notif-h"><h3>' + T("การแจ้งเตือน") + ' ' + (unread ? '<span class="pill bad">' + unread + ' ' + T("ใหม่") + '</span>' : '') + '</h3>' +
    (unread ? '<button class="btn ghost sm" data-act="readAll">' + T("อ่านทั้งหมด") + '</button>' : '') + '</div><div class="notif-l">' +
    (list.length ? list.map((x, i) =>
      '<button class="nitem ' + x.kind + (x.read ? " read" : "") + '" data-act="openNotif" data-id="' + esc(x.key) + '" data-target="' + esc(x.go) + '">' +
        '<span class="ti">' + ico(x.icon) + '</span>' +
        '<span>' + (x.rawT ? raw(x.text) : esc(x.text)) + '<small>' + (x.rawS ? raw(x.sub) : esc(x.sub)) + '</small></span>' +
        '<span class="dot"></span>' +
      '</button>'
    ).join("") : '<div class="empty">' + ico("bell") + '<span>' + T("ไม่มีการแจ้งเตือน") + '</span></div>') + '</div>';
}

function toggleNotif() {
  if (notifEl) { closeNotif(); return; }
  notifEl = document.createElement("div");
  notifEl.className = "notif";
  notifEl.setAttribute("role", "dialog");
  notifEl.setAttribute("aria-label", T("การแจ้งเตือน"));
  fillNotif();
  $("#layer").appendChild(notifEl);
}

function closeNotif(now) {
  if (!notifEl) return;

  notifEl = null;
  if (now) { n.remove(); return; }
  n.classList.add("out");
  setTimeout(() => n.remove(), 180);
}
